<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16435E">

<title>Dietari · Gestió de la parada</title>
<style>
:root{
  --blau:#16435E; --blau-fosc:#0E2D40; --sal:#F7F5F0; --paper:#FFFFFF;
  --tinta:#1B2730; --tinta-2:#5B6B76; --linia:#E3DED4; --linia-2:#CFC8BA;
  --ocre:#A8741F; --verd:#2F6B4F; --vermell:#A4393B; --pendent:#B07C2A;
  --radius:10px; --nav-h:58px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{
  margin:0; background:var(--sal); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
.num, input[type=text].num, td.n, th.n, .imp{
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
}
header.app{
  background:var(--blau); color:#fff; padding:10px 14px;
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  position:sticky; top:0; z-index:20;
}
header.app h1{font-size:1.05rem; margin:0; font-weight:700; letter-spacing:.04em; text-transform:uppercase;}
header.app .any{
  background:var(--blau-fosc); color:#fff; border:1px solid rgba(255,255,255,.25);
  border-radius:6px; padding:3px 8px; font-size:.9rem; font-weight:600;
}
main{padding:12px; max-width:760px; margin:0 auto;}
h2{font-size:1rem; margin:4px 0 10px; letter-spacing:.05em; text-transform:uppercase; color:var(--blau); font-weight:700;}
h3{font-size:.9rem; margin:14px 0 6px; color:var(--tinta-2); font-weight:600; letter-spacing:.03em; text-transform:uppercase;}
.card{background:var(--paper); border:1px solid var(--linia); border-radius:var(--radius); padding:12px; margin-bottom:12px;}
.card.tight{padding:8px;}
label{display:block; font-size:.78rem; color:var(--tinta-2); margin:10px 0 3px; font-weight:600; letter-spacing:.02em;}
input,select,textarea{
  width:100%; padding:10px; border:1px solid var(--linia-2); border-radius:8px;
  font-size:1rem; background:#fff; color:var(--tinta); font-family:inherit;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blau); outline-offset:1px;}
textarea{min-height:64px; resize:vertical;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
button{
  font-family:inherit; font-size:.95rem; border-radius:8px; border:1px solid var(--linia-2);
  background:#fff; color:var(--tinta); padding:10px 14px; cursor:pointer;
}
button.primary{background:var(--blau); border-color:var(--blau); color:#fff; font-weight:600; width:100%; margin-top:14px;}
button.small{padding:6px 10px; font-size:.85rem;}
button.danger{color:var(--vermell); border-color:var(--vermell);}
button.ghost{border:none; background:none; color:var(--blau); font-weight:600; padding:6px;}
.fab-add{position:fixed; right:16px; bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  width:52px; height:52px; border-radius:50%; background:var(--ocre); color:#fff; border:none;
  font-size:1.7rem; line-height:1; box-shadow:0 3px 10px rgba(0,0,0,.25); z-index:15;}
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--paper); border-top:1px solid var(--linia-2);
  display:flex; z-index:30;
}
nav.tabs button{
  flex:1; border:none; background:none; border-radius:0; padding:6px 0 4px;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:.66rem; color:var(--tinta-2); font-weight:600; letter-spacing:.02em;
}
nav.tabs button.on{color:var(--blau);}
nav.tabs button .ic{font-size:1.25rem; line-height:1;}
nav.tabs button.on .ic{transform:translateY(-1px);}
table{width:100%; border-collapse:collapse; font-size:.84rem;}
th{font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--tinta-2); font-weight:600;}
th,td{padding:6px 6px; border-bottom:1px solid var(--linia); text-align:left;}
td.n,th.n{text-align:right; white-space:nowrap;}
tr.total td{font-weight:700; border-top:2px solid var(--linia-2); background:#FBF9F4;}
tr.clickable{cursor:pointer;}
tr.clickable:active{background:#F2EEE5;}
td.clickable{cursor:pointer; color:var(--blau); text-decoration:underline dotted;}
.kpi.clickable{cursor:pointer;}
.kpi.clickable:active{background:#F2EEE5;}
.kpi.clickable .v{text-decoration:underline dotted;}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.pos{color:var(--verd);} .neg{color:var(--vermell);} .pend{color:var(--pendent); font-weight:600;}
.muted{color:var(--tinta-2); font-size:.82rem;}
.big{font-size:1.5rem; font-weight:700;}
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.kpi{background:var(--paper); border:1px solid var(--linia); border-radius:var(--radius); padding:10px;}
.kpi .v{font-size:1.25rem; font-weight:700; margin-top:2px;}
.kpi .l{font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--tinta-2); font-weight:600;}
.monthbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.monthbar .m{font-weight:700; font-size:1rem; text-transform:capitalize;}
.monthbar button{width:42px;}
.chip{display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.03em;}
.chip.pagat,.chip.ingressat{background:#E4EFE8; color:var(--verd);}
.chip.pendent,.chip.parcial{background:#F5EBD8; color:var(--pendent);}
.chip.cancelat{background:#F3E2E2; color:var(--vermell);}
.chip.dietari{background:#E7E9EF; color:#4A5268;}
.comprec{font-size:.78rem; font-weight:700; margin-top:2px; cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px;}
.item{display:flex; justify-content:space-between; gap:8px; padding:9px 2px; border-bottom:1px solid var(--linia); cursor:pointer;}
.item:last-child{border-bottom:none;}
.item .t{font-weight:600; font-size:.92rem;}
.item .s{font-size:.78rem; color:var(--tinta-2); margin-top:1px;}
.item .imp{font-weight:700; white-space:nowrap;}
.modal-bg{position:fixed; inset:0; background:rgba(20,30,38,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
.modal{background:var(--sal); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:14px 16px calc(20px + env(safe-area-inset-bottom));}
.modal h2{display:flex; justify-content:space-between; align-items:center;}
.modal h2 .x{background:none; border:none; font-size:1.4rem; color:var(--tinta-2); padding:0 4px;}
.menu .item .t{font-size:1rem;}
.menu .item .ic{font-size:1.2rem; margin-right:10px;}
.subtabs{display:flex; gap:6px; margin-bottom:12px;}
.subtabs button{flex:1; font-size:.85rem; padding:8px 4px;}
.subtabs button.on{background:var(--blau); color:#fff; border-color:var(--blau); font-weight:600;}
.searchbar{margin-bottom:10px;}
.obsline{font-size:.82rem; padding:4px 0; color:var(--tinta-2);}
.obsline b{color:var(--tinta);}
.warn{background:#FBF3E2; border:1px solid #E8D7AE; border-radius:8px; padding:8px 10px; font-size:.84rem; margin:8px 0;}
.recline{display:flex; justify-content:space-between; align-items:baseline; background:var(--blau); color:#fff;
  border-radius:8px; padding:10px 12px; margin-top:14px;}
.recline .l{font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; opacity:.85;}
.recline .v{font-size:1.4rem; font-weight:700;}
@media (prefers-reduced-motion:no-preference){ .modal{animation:up .18s ease-out;} @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}} }
.lineblk{border:1px solid var(--vora,#e3e3e3); border-radius:8px; padding:8px; margin:8px 0;}
.lbhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
.lbtitle{font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; opacity:.8;}
.lbsum{font-weight:700;}
.lrow{display:grid; grid-template-columns:88px 1fr auto auto; gap:6px; align-items:center; margin-bottom:6px;}
.lrow .li-c{min-width:0;}
.lrow .li-qty{grid-column:1/-1; display:flex; gap:6px; margin:-2px 0 2px;}
.lrow .li-quant{width:76px;}
.lrow .li-unitat{flex:1; min-width:0;}
.enllac input[readonly]{opacity:.7; cursor:default;}
.enllac .ex-open{padding:2px 6px;}
.li-reclbl{display:flex; gap:3px; align-items:center; font-size:.82rem; white-space:nowrap;}
.li-del{padding:6px 9px;}
.li-add{margin-top:2px;}
</style>
</head>
<body>
<header class="app">
  <h1>Dietari <span id="syncDot" title="Estat de sincronització" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;vertical-align:middle;margin-left:4px;"></span></h1>
  <div style="display:flex;gap:8px;align-items:center;">
    <select id="anySel" class="any" aria-label="Any actiu"></select>
    <button id="logoutBtn" title="Tanca la sessió" style="background:var(--blau-fosc);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:3px 8px;font-size:.85rem;">Surt</button>
  </div>
</header>
<main id="view"></main>
<button class="fab-add" id="fab" aria-label="Afegeix" style="display:none">+</button>
<nav class="tabs" id="nav">
  <button data-v="avui"><span class="ic">✎</span>Avui</button>
  <button data-v="dietari"><span class="ic">▦</span>Dietari</button>
  <button data-v="cc"><span class="ic">⛁</span>Banc</button>
  <button data-v="factures"><span class="ic">⎘</span>Factures</button>
  <button data-v="compres"><span class="ic">◔</span>Compres</button>
  <button data-v="mes"><span class="ic">☰</span>Més</button>
</nav>
<div id="modalRoot"></div>

<div id="loginScreen" style="display:none; position:fixed; inset:0; z-index:100; background:var(--sal); padding:24px 16px; overflow:auto;">
  <div style="max-width:380px; margin:8vh auto 0;">
    <h1 style="color:var(--blau); text-transform:uppercase; letter-spacing:.05em; font-size:1.3rem; margin-bottom:4px;">Dietari</h1>
    <p style="color:var(--tinta-2); font-size:.9rem; margin-top:0;">Gestió de la parada</p>
    <div class="card">
      <label for="loginEmail">Correu electrònic</label>
      <input type="email" id="loginEmail" autocomplete="username" inputmode="email">
      <label for="loginPass">Contrasenya</label>
      <input type="password" id="loginPass" autocomplete="current-password">
      <div id="loginErr" style="color:var(--vermell); font-size:.85rem; margin-top:8px; display:none;"></div>
      <button class="primary" id="loginBtn">Entra</button>
    </div>
  </div>
</div>

function loadCache(){ try{const r=JSON.parse(localStorage.getItem(KEY)); return (r&&r.years)?r:null;}catch(e){return null;} }
function saveCache(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function cacheTs(){ return parseInt(localStorage.getItem(KEY+'.ts')||'0',10); }
function setCacheTs(t){ try{localStorage.setItem(KEY+'.ts',String(t));}catch(e){} }

/* --- indicador de sincronització --- */
function syncStatus(estat){ // 'ok' verd, 'pendent' taronja, 'error' vermell, 'offline' gris
  const d=document.getElementById('syncDot'); if(!d)return;
  d.style.background={ok:'#2F6B4F',pendent:'#B07C2A',error:'#A4393B',offline:'#888'}[estat]||'#888';
  d.title={ok:'Sincronitzat',pendent:'Desant…',error:'Error de desat: revisa la connexió',offline:'Sense connexió: es desa localment'}[estat]||'';
}

/* --- desat al núvol, amb retard per agrupar canvis --- */
let saveTimer=null, savePending=false;
function save(){
  saveCache();
  savePending=true; syncStatus('pendent');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushRemote,1500);
}
async function pushRemote(){
  if(!sbUser){syncStatus('error');return;}
  const ts=Date.now();
  try{
    const {error}=await sb.from('app_state').upsert({user_id:sbUser.id,data:S,updated_at:new Date(ts).toISOString()});
    if(error)throw error;
    savePending=false; setCacheTs(ts); syncStatus('ok');
  }catch(e){
    console.error('Desat remot fallit',e);
    syncStatus(navigator.onLine?'error':'offline');
  }
}
window.addEventListener('online',()=>{ if(savePending)pushRemote(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&savePending){clearTimeout(saveTimer);pushRemote();} });

/* --- càrrega: núvol primer, cau si no hi ha connexió --- */
async function loadRemote(){
  const {data,error}=await sb.from('app_state').select('data,updated_at').eq('user_id',sbUser.id).maybeSingle();
  if(error)throw error;
  return data; // null si encara no existeix
}
async function load(){
  const cache=loadCache();
  try{
    const remot=await loadRemote();
    if(remot&&remot.data&&remot.data.years){
      const tsRemot=new Date(remot.updated_at).getTime()||0;
      if(cache&&cacheTs()>tsRemot){ S=cache; await pushRemote(); } // canvis locals més nous (fets sense connexió)
      else { S=remot.data; setCacheTs(tsRemot); saveCache(); syncStatus('ok'); }
    } else if(cache){ S=cache; await pushRemote(); } // primera pujada de dades existents
    else { S=estatBuit(); await pushRemote(); }
  }catch(e){
    console.error('Càrrega remota fallida, es fa servir la còpia local',e);
    S=cache||estatBuit(); syncStatus('offline');
  }
}

function Y(){return S.years[S.activeYear];}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ================= UTILITATS ================= */
const fmtEUR=new Intl.NumberFormat('ca-ES',{style:'currency',currency:'EUR'});
function eur(n){return (n==null||isNaN(n))?'—':fmtEUR.format(n);}
function eur0(n){return fmtEUR.format(n||0);}
function num(v){if(v==null)return 0; if(typeof v==='number')return v; v=String(v).trim().replace(/\./g,m=>m).replace(',','.'); const n=parseFloat(v); return isNaN(n)?0:n;}
function numOrNull(v){const s=String(v??'').trim(); if(s==='')return null; return num(s);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hui(){const d=new Date();return iso(d);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dataCA(isoStr){const [a,m,d]=isoStr.split('-');return parseInt(d)+' '+MESOS[parseInt(m)-1].slice(0,3)+'.';}
function dataCAL(isoStr){const [a,m,d]=isoStr.split('-');return parseInt(d)+' de '+MESOS[parseInt(m)-1]+' de '+a;}
function mesDeIso(s){return parseInt(s.slice(5,7))-1;}
/* Rang d'una setmana en curt: «3 – 8 ago.» si no canvia de mes, «27 jul. – 1 ago.» si en canvia */
function rangCurt(des,fins){
  return (des.slice(0,7)===fins.slice(0,7)?parseInt(des.slice(8)):dataCA(des))+' – '+dataCA(fins);
}
/* Setmanes Dl–Ds: 6 dies. Cada setmana pertany al mes que té més dies (el mes del seu dimecres) */
function mondayOnOrBefore(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function setmanaDe(ds){const mon=mondayOnOrBefore(new Date(ds+'T12:00'));const w=[];for(let i=0;i<6;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);w.push(iso(x));}return w;}
function dissabteDe(ds){return setmanaDe(ds)[5];}
function mesDeSetmana(satIso){const x=mondayOnOrBefore(new Date(satIso+'T12:00'));x.setDate(x.getDate()+2);return x.getMonth();}
function setmanesDelMes(any,mes){
  const setmanes=[]; let mon=mondayOnOrBefore(new Date(any,mes,1));
  for(;;){
    const dim=new Date(mon); dim.setDate(mon.getDate()+2); // el dimecres decideix el mes
    if(dim.getFullYear()>any||(dim.getFullYear()===any&&dim.getMonth()>mes))break;
    if(dim.getFullYear()===any&&dim.getMonth()===mes){
      const w=[];for(let i=0;i<6;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);w.push(iso(x));}
      setmanes.push(w);
    }
    mon.setDate(mon.getDate()+7);
  }
  return setmanes;
}
function dia(isoStr){return Y().dies[isoStr]||null;}
/* Fins al 21-07-2026 el dietari és una còpia informativa de l'Excel: els vincles entre pestanyes
   (factures pagades → dietari, ingressos TPV del banc → TPV net) només funcionen a partir d'aquesta data */
const VINCLES_DES='2026-07-22';
/* Pagaments d'una factura: llista {data, talo, imp}. Una factura es pot pagar en diversos terminis
   (cada un amb data i taló). Si no hi ha llista de pagaments, es fa servir el pagament únic (dataPagISO/talo/imp). */
function factPags(f){
  if(Array.isArray(f.pagaments)&&f.pagaments.length)return f.pagaments.filter(p=>p&&p.data).map(p=>({id:p.id||'',data:p.data,talo:(p.talo||'').trim(),imp:num(p.imp),mode:p.mode||f.mode||'Taló',banc:!!p.banc}));
  if(f.estat==='Pagat'&&f.dataPagISO)return [{id:'',data:f.dataPagISO,talo:(f.talo||'').trim(),imp:num(f.imp),mode:f.mode||'Taló',banc:false}];
  return [];
}
/* Un pagament amb data futura (taló emès a venir) encara NO està pagat: queda pendent fins al dia. */
function factPagsFets(f){const h=hui();return factPags(f).filter(p=>p.data<=h);}
function factPagsPrevistos(f){const h=hui();return factPags(f).filter(p=>p.data>h);}
function factPagat(f){return factPagsFets(f).reduce((s,p)=>s+num(p.imp),0);}
function factPrevist(f){return factPagsPrevistos(f).reduce((s,p)=>s+num(p.imp),0);}
/* Estat real: Pagat si el que ja s'ha pagat cobreix l'import, Parcial si en cobreix una part,
   i Pendent si encara no s'ha pagat res (encara que hi hagi pagaments programats per més endavant). */
function factEstat(f){
  const pays=factPags(f);
  if(!pays.length)return f.estat||'Pendent';
  const pg=factPagat(f),tot=num(f.imp);
  return pg<=0?'Pendent':(pg+0.005<tot?'Parcial':'Pagat');
}
/* ----- Secció «Pagaments» reutilitzable (formulari de factura i de compra) ----- */
function paysRowHTML(p){const mode=(p&&p.mode)||'Taló';return `<div class="payrow" data-pid="${esc((p&&p.id)||'')}" style="border:1px solid var(--linia);border-radius:8px;padding:8px;margin-bottom:8px">
    <div class="row3">
      <input type="date" class="pay-data" value="${(p&&p.data)||''}">
      <select class="pay-mode">${F_MODES.map(c=>`<option ${c===mode?'selected':''}>${c}</option>`).join('')}</select>
      <input class="num pay-imp" inputmode="decimal" placeholder="Import" value="${p&&p.imp!=null&&p.imp!==''?p.imp:''}">
    </div>
    <div class="row2" style="margin-top:6px">
      <input class="pay-talo" placeholder="Núm. de taló" value="${esc((p&&p.talo)||'')}">
      <label class="li-reclbl" title="Crea un moviment al compte corrent amb aquest pagament"><input type="checkbox" class="pay-banc" ${p&&p.banc?'checked':''}> apunt al banc</label>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:4px"><button class="small pay-del" type="button">✕ treu</button></div>
  </div>`;}
function paysSectionHTML(pays){
  return `<h3 style="margin:12px 0 2px">Pagaments</h3>
    <p class="muted" style="margin:0 0 8px">Es pot pagar en diverses dates; cada pagament té la seva data, forma de pagament i import, i surt al dietari el seu dia. Deixa-ho buit si encara està pendent. Marca <b>apunt al banc</b> si vols que el pagament també surti al compte corrent.</p>
    <div class="pays-cont">${(pays.length?pays:[{data:'',talo:'',imp:'',mode:'Taló',banc:false}]).map(paysRowHTML).join('')}</div>
    <button class="small pays-add" type="button">+ pagament</button>
    <div class="recline"><span class="l">Pagat</span><span class="v num pays-sum">—</span></div>`;
}
/* Enllaça la secció; totalFn() retorna l'import total de la factura. Retorna llegir-pagaments(). */
function bindPaysSection(el,totalFn){
  const cont=el.querySelector('.pays-cont'); if(!cont)return ()=>[];
  const read=()=>[...cont.querySelectorAll('.payrow')].map(r=>({id:r.dataset.pid||'',
    data:r.querySelector('.pay-data').value,talo:r.querySelector('.pay-talo').value.trim(),
    imp:numOrNull(r.querySelector('.pay-imp').value),mode:r.querySelector('.pay-mode').value,
    banc:r.querySelector('.pay-banc').checked}));
  const recalc=()=>{const arr=read(),h=hui(),tot=num(totalFn());
    const pg=arr.filter(p=>p.data&&p.data<=h).reduce((s,p)=>s+num(p.imp),0);
    const pv=arr.filter(p=>p.data&&p.data>h).reduce((s,p)=>s+num(p.imp),0);
    const sum=pg+pv;
    el.querySelector('.pays-sum').textContent=eur0(pg)+(tot?' de '+eur0(tot):'')+
      (pv?' · previst '+eur0(pv):'')+(tot?(sum+0.005<tot?' · falta '+eur0(tot-sum):(sum>tot+0.005?' · excés':(pv?'':' ✓'))):'');};
  const rerender=arr=>{cont.innerHTML=(arr.length?arr:[{data:'',talo:'',imp:'',mode:'Taló',banc:false}]).map(paysRowHTML).join('');recalc();};
  cont.addEventListener('input',recalc);
  cont.addEventListener('click',e=>{const d=e.target.closest('.pay-del');if(!d)return;
    const arr=read(),i=[...cont.querySelectorAll('.payrow')].indexOf(d.closest('.payrow'));arr.splice(i,1);rerender(arr);});
  el.querySelector('.pays-add').addEventListener('click',()=>{const arr=read();arr.push({data:'',talo:'',imp:'',mode:'Taló',banc:false});rerender(arr);});
  recalc();
  el.addEventListener('input',e=>{if(!e.target.closest('.pays-cont'))recalc();});
  // cada pagament rep un id estable: és el que lliga l'apunt del compte corrent amb el pagament
  return ()=>read().filter(p=>p.data||p.imp!=null).map(p=>({id:p.id||uid(),data:p.data,talo:p.talo,
    imp:p.imp==null?0:p.imp,mode:p.mode||'Taló',banc:!!p.banc}));
}
/* Aplica els pagaments a una factura i en recalcula l'estat. La data de la factura és la del
   primer pagament (el més antic), no l'ordre en què s'han escrit. */
function primerPagament(pagaments){
  const amb=(pagaments||[]).filter(p=>p&&p.data).slice().sort((a,b)=>a.data<b.data?-1:1);
  return amb.length?amb[0]:null;
}
function aplicaPagaments(f,pagaments){
  f.pagaments=pagaments;
  f.estat=factEstat(f);
  const p0=primerPagament(pagaments);
  f.dataPagISO=p0?p0.data:'';
  f.talo=p0?p0.talo:'';
  if(p0&&p0.mode)f.mode=p0.mode;
  return f;
}
/* ----- Apunts al compte corrent generats des dels pagaments marcats «apunt al banc» -----
   Van a la categoria «Pagament de factures», NO a «Despeses cc»: la factura ja compta al
   dietari pel seu bloc (Fp/FpL/Despeses) i comptar-la també com a despesa c/c la duplicaria. */
function catPagamentFactura(){return ccCatByRole('pagfact')||ccCatByRole('despcc');}
function sincronitzaApuntsBanc(f){
  if(!f||!f.id)return;
  const pays=(f.pagaments||[]).filter(p=>p&&p.data&&p.id);
  const vius=new Set(pays.filter(p=>p.banc).map(p=>p.id));
  // treu els apunts d'aquesta factura que ja no toquen (pagament esborrat o casella desmarcada)
  Y().cc=Y().cc.filter(m=>!(m.srcFact&&m.srcFact===f.id&&!vius.has(m.srcPag)));
  const cat=catPagamentFactura();
  pays.filter(p=>p.banc).forEach(p=>{
    const base={data:p.data,concepte:'Factura #'+(f.num??'—')+(f.empresa?' · '+f.empresa:''),
      catId:cat?cat.id:'altres',debe:num(p.imp),haber:null,
      estat:p.data<=hui()?'Pagat':'Pendent',
      obs:(p.mode||'Taló')+(p.talo?' núm. '+p.talo:''),srcFact:f.id,srcPag:p.id};
    const m=Y().cc.find(x=>x.srcPag&&x.srcPag===p.id);
    if(m)Object.assign(m,base); else Y().cc.push(Object.assign({id:uid(),recDia:false,tpvData:''},base));
  });
}
function esborraApuntsBanc(factId){if(!factId)return;Y().cc=Y().cc.filter(m=>!(m.srcFact&&m.srcFact===factId));}
/* Pagaments de factures fets un dia concret (només des del 22-07) */
/* Text resum de l'estat de pagament d'una factura, per a les llistes */
function factPagInfo(f){
  const est=factEstat(f), pays=factPags(f), prev=factPagsPrevistos(f);
  const previst=prev.length?' · previst '+prev.map(p=>dataCA(p.data)).join(', '):'';
  if(!pays.length)return '';
  if(est==='Pendent')return previst;
  if(est==='Parcial')return ' · pagat '+eur0(factPagat(f))+' de '+eur0(num(f.imp))+previst;
  return ' · pagada '+(pays.length>1?'en '+pays.length+' pagaments':dataCA(pays[pays.length-1].data))+(f.recDia?' (rec)':'');
}
function factPagsDia(ds){
  if(!ds||ds<VINCLES_DES)return [];
  const out=[];
  Y().factures.forEach(f=>{factPags(f).forEach(p=>{if(p.data===ds)out.push({f:f,imp:p.imp,talo:p.talo});});});
  return out;
}
function factDia(ds){const seen={},out=[];factPagsDia(ds).forEach(x=>{if(!seen[x.f.id]){seen[x.f.id]=1;out.push(x.f);}});return out;}
function factDiaRec(ds){return factPagsDia(ds).filter(x=>x.f.recDia).reduce((s,x)=>s+num(x.imp),0);}
/* Cada factura suma a un bloc del dia segons la seva categoria: Fp / FpL / Despeses (la resta → Despeses) */
function factBlock(f){const c=(f&&f.categoria)||'';return c==='Fp'?'fp':c==='FpL'?'fpl':'desp';}
function factDiaBloc(ds,bloc){return factPagsDia(ds).filter(x=>factBlock(x.f)===bloc).reduce((s,x)=>s+num(x.imp),0);}
/* Factures automàtiques lligades a una compra (srcType+srcId). Estat segons data: amb data→Pagat, sense→Pendent */
function nextFacturaNum(){return Y().factures.reduce((m,x)=>Math.max(m,num(x.num)),0)+1;}
function syncFacturaSrc(t,id,o){ // o={imp,dataISO,categoria,empresa,concepte}
  let f=Y().factures.find(x=>x.auto&&x.srcType===t&&x.srcId===id);
  if(o.imp==null||num(o.imp)===0){ if(f)Y().factures=Y().factures.filter(x=>x!==f); return; }
  const pagat=!!o.dataISO;
  const base={imp:num(o.imp),categoria:o.categoria||'Despeses',empresa:(o.empresa||'').trim(),concepte:o.concepte||'',
    estat:pagat?'Pagat':'Pendent',dataPagISO:pagat?o.dataISO:'',mode:'Taló',talo:'',obs:'',auto:true,srcType:t,srcId:id};
  if(f)Object.assign(f,base);
  else Y().factures.push(Object.assign({id:uid(),num:nextFacturaNum(),recDia:false},base));
}
function deleteFacturaSrc(t,id){
  const f=Y().factures.find(x=>x.auto&&x.srcType===t&&x.srcId===id);
  if(f&&f.pdf){try{sb.storage.from('factures').remove([f.pdf]);}catch(e){}}
  if(f)esborraApuntsBanc(f.id);
  Y().factures=Y().factures.filter(x=>!(x.auto&&x.srcType===t&&x.srcId===id));
}
function diaCatSelect(id,val){return `<select id="${id}">`+['Despeses','FpL','Fp'].map(c=>`<option ${c===(val||'Despeses')?'selected':''}>${c}</option>`).join('')+'</select>';}
function despCCDia(ds){const c=ccCatByRole('despcc');if(!c)return [];return Y().cc.filter(m=>m.data===ds&&m.catId===c.id&&m.estat!=='Cancelat');}
function despCCDiaRec(ds){return despCCDia(ds).filter(m=>m.recDia).reduce((s,m)=>s+num(m.debe),0);}
/* ----- Línies del dia (Fp/FpL/Despeses): cada línia {imp, c(concepte), rec(bool)} ----- */
function lineSum(a){return (a||[]).reduce((s,l)=>s+num(l.imp),0);}        // suma imports
function lineRec(a){return (a||[]).reduce((s,l)=>s+(l.rec?num(l.imp):0),0);} // suma només línies marcades rec
/* Olives marcades Fp/FpL sumen al dietari, atribuïdes al dissabte de la seva setmana */
function olivesDiaBloc(ds,bloc){return ds?(Y().olivesCompres||[]).filter(c=>c.bloc===bloc&&c.set&&olDissabte(c.set)===ds).reduce((s,c)=>s+num(c.imp),0):0;}
function dFp(d,ds){return (d?lineSum(d.fpLines):0)+factDiaBloc(ds,'fp')+olivesDiaBloc(ds,'fp');}
function dFpl(d,ds){return (d?lineSum(d.fplLines):0)+factDiaBloc(ds,'fpl')+olivesDiaBloc(ds,'fpl');}
function dDesp(d,ds){return (d?lineSum(d.despLines):0)+factDiaBloc(ds,'desp');}
/* Totes les línies (de tots els dies de l'any actiu) d'un bloc: 'fpLines'|'fplLines'|'despLines' */
function totesLinies(key){
  const out=[];
  Object.values(Y().dies).forEach(d=>{(d[key]||[]).forEach(l=>out.push(l));});
  return out;
}
function conceptesUsats(key){return distinctVals(totesLinies(key),'c');}
function unitatsUsades(){
  const all=[...totesLinies('fpLines'),...totesLinies('fplLines'),...totesLinies('despLines')];
  return distinctVals(all,'unitat');
}
function diaTeRes(d){return !!(d&&(d.ef!=null||d.tpv!=null||(d.fpLines&&d.fpLines.length)||(d.fplLines&&d.fplLines.length)||(d.despLines&&d.despLines.length)||(d.obs&&d.obs.trim())));}
/* TPV: el net és l'ingrés real al banc (categoria TPV) d'aquell dia. Si encara no n'hi ha, s'usa el brut provisional. Comissió = brut − net */
function tpvBancDia(ds){if(!ds||ds<VINCLES_DES)return 0;const c=ccCatByRole('tpv');if(!c)return 0;return Y().cc.filter(m=>m.catId===c.id&&m.estat!=='Cancelat'&&(m.tpvData||m.data)===ds).reduce((s,m)=>s+num(m.haber),0);}
/* TPV net del dia = ingrés real al banc (des del 22-07); si encara no n'hi ha, s'usa el brut.
   La comissió NO es reparteix per dia: és una xifra mensual (vegeu comissioMes / totalsMes). */
function tpvNetDia(d,ds){const b=tpvBancDia(ds);return b>0?b:num(d?d.tpv:0);}
function comissioTpvDia(d,ds){const b=tpvBancDia(ds);return b>0?num(d?d.tpv:0)-b:0;}
function comissioTpvRang(isos){return (isos||[]).reduce((s,ds)=>s+comissioTpvDia(dia(ds),ds),0);}
function tpvNetRang(isos){return (isos||[]).reduce((s,ds)=>s+tpvNetDia(dia(ds),ds),0);}
function tpvBrutRang(isos){return (isos||[]).reduce((s,ds)=>{const d=dia(ds);return s+(d?num(d.tpv):0);},0);}
function recDia(d,ds){let r=0;if(d){r+=num(d.ef)+tpvNetDia(d,ds)+lineRec(d.fpLines)+lineRec(d.fplLines)+lineRec(d.despLines);}if(ds)r+=factDiaRec(ds)+despCCDiaRec(ds);return r;}
function totalsRang(isos){
  const t={ef:0,tpv:0,rec:0,desp:0,fp:0,fpl:0};
  for(const ds of isos){const d=dia(ds);
    if(d){t.ef+=num(d.ef);t.tpv+=num(d.tpv);}

function histAny(any){return HISTORIC[any||S.activeYear]||null;}

function histMes(mes,camp,any){const h=histAny(any);if(!h)return 0;const a=h[camp];return a?num(a[mes]):0;}
/* Recaptació = efectiu + TPV (full «Notes» de l'Excel), o sigui que l'efectiu se'n dedueix */
function histTotalsMes(mes,any){
  const rec=histMes(mes,'rec',any), tpv=histMes(mes,'tpv',any);
  return {ef:r2(rec-tpv),tpv:tpv,rec:rec,desp:histMes(mes,'desp',any),fp:histMes(mes,'fp',any),fpl:histMes(mes,'fpl',any)};
}
/* Valor d'un camp d'un mes de QUALSEVOL any (històric o normal), per poder comparar-los.
   Als anys normals cal calcular amb les dades d'aquell any, així que es commuta un instant. */
function valMesAny(any,mes,camp){
  const hist=HISTORIC[any];
  if(hist)return camp==='dcc'?histMes(mes,'dcc',any):histTotalsMes(mes,any)[camp];
  if(!S.years||!S.years[any])return null;
  const prev=S.activeYear;
  try{ S.activeYear=any; return camp==='dcc'?despCCMes(mes):totalsMes(mes)[camp]; }
  finally{ S.activeYear=prev; }
}
/* Als costos, pujar és dolent: el color va a l'inrevés que a la recaptació */
const CAMP_COST={desp:true,dcc:true,fp:true,fpl:true};
/* Comparació d'un camp d'un mes amb el mateix mes de l'any anterior */
function compMes(mes,camp){
  const anyAnt=String(parseInt(S.activeYear)-1);
  const ant=valMesAny(anyAnt,mes,camp);
  if(ant==null||!ant)return null;
  const act=valMesAny(S.activeYear,mes,camp);
  if(act==null||!act)return null;
  return {anyAnt:anyAnt,ant:ant,act:act,dif:r2(act-ant),pct:100*(act-ant)/ant,camp:camp};
}

/* ---- Acumulats d'un any sencer o d'un tros d'any, per comparar-los entre anys ----
   «desp» ja porta les despeses de compte corrent i «fp» ja porta FpL: són les mateixes
   agrupacions que fa servir la taula del resum anual, perquè les xifres quadrin. */
function anyExisteix(any){return !!(HISTORIC[any]||(S.years&&S.years[any]));}
function acumulaRang(any,mDes,mFins){
  if(!anyExisteix(any))return null;
  const o={ef:0,tpv:0,rec:0,desp:0,fp:0};
  const prev=S.activeYear;
  try{
    S.activeYear=any;
    for(let m=mDes;m<=mFins;m++){
      const t=totalsMes(m), d=despCCMes(m);
      o.ef+=t.ef; o.tpv+=t.tpv; o.rec+=t.rec; o.desp+=t.desp+d; o.fp+=t.fp+t.fpl;
    }
  }finally{ S.activeYear=prev; }
  Object.keys(o).forEach(k=>o[k]=r2(o[k]));
  return o;
}
/* Últim mes amb moviment d'un any (per saber fins on arriba «el que portem d'any»).
   Es miren els moviments EN CRU: totalsMes resta la comissió TPV desada, i això faria que un
   mes buit amb comissió apuntada (gen–jun del 2026) semblés que té dades. */
function ultimMesAmbDades(any){
  if(!anyExisteix(any))return -1;
  let last=-1;
  const prev=S.activeYear;
  try{
    S.activeYear=any;
    for(let m=0;m<12;m++){
      let hi;
      if(esHistoric()){const t=histTotalsMes(m); hi=!!(t.rec||t.desp||t.fp||t.fpl||histMes(m,'dcc'));}
      else{const t=totalsRang(isosDelMes(m)); hi=!!(t.ef||t.tpv||t.rec||t.desp||t.fp||t.fpl||despCCMes(m));}
      if(hi)last=m;
    }
  }finally{ S.activeYear=prev; }
  return last;
}

function varCellHTML(act,ant,esCost){

  const dif=r2(act-ant), pct=100*dif/ant, puja=dif>=0, bo=esCost?!puja:puja;
  return `<td class="n ${bo?'pos':'neg'}">${puja?'▲':'▼'} ${Math.abs(pct).toFixed(1)} %<div class="muted" style="font-size:.72rem;font-weight:400">${puja?'+':'−'}${eur0(Math.abs(dif))}</div></td>`;
}
function comissioMesStored(mes){const cm=Y().comTpvMes;return cm&&cm[mes]!=null?num(cm[mes]):null;}
/* Comissió automàtica del banc del mes (ingressos TPV, brut−net) — compta des del 22-07 */
function comissioAutoMes(mes){return comissioTpvRang(isosDelMes(mes));}
/* Comissió total del mes = xifra manual desada (resum Excel) + comissió automàtica del banc */
function comissioMes(mes){return (comissioMesStored(mes)||0)+comissioAutoMes(mes);}
/* Total del mes: la recaptació resta la comissió TPV del mes UNA vegada. Les setmanes es queden amb
   el TPV tal com està; la comissió només es descompta al total mensual/quatrimestral (com al resum Excel).
   El TPV net que es mostra = valor desat; el brut = net + comissió (informatiu). */
function totalsMes(mes){if(esHistoric())return histTotalsMes(mes);const t=totalsRang(isosDelMes(mes));const s=comissioMesStored(mes);if(s!=null)t.rec=r2(t.rec-s);return t;}
/* Caixa d'efectiu acumulada, a partir de juliol (mes índex 6): cada mes comença amb l'efectiu
   acumulat del mes anterior, hi suma l'efectiu REAL de les seves setmanes (el que ha entrat menys
   el que se n'ha anat utilitzant), i s'hi pot afegir un ajust manual (+/-).
   L'efectiu bancari és un valor purament manual, sense fórmula.
   Important: les sortides d'efectiu NO toquen la recaptació ni les despeses. L'«Efectiu» del mes i
   de l'any segueix sent el que ha entrat; això només porta els diners que hi ha físicament a la caixa. */
const CAIXA_DES=6; // juliol
function caixaAjustMes(mes){const c=Y().caixaMes&&Y().caixaMes[mes];return c&&c.ajust!=null?num(c.ajust):0;}
function caixaBancariMes(mes){const c=Y().caixaMes&&Y().caixaMes[mes];return c&&c.bancari!=null?num(c.bancari):null;}
/* Sortides d'efectiu d'una setmana, indexades pel dilluns: [{c:'concepte', imp:0}] */
function caixaSetLines(monIso){const a=Y().caixaSet&&Y().caixaSet[monIso];return Array.isArray(a)?a:[];}
function caixaSetSortides(monIso){return r2(caixaSetLines(monIso).reduce((s,l)=>s+num(l.imp),0));}
function efectiuRealSet(w){return r2(totalsRang(w).ef-caixaSetSortides(w[0]));}
function caixaSortidesMes(mes){return r2(setmanesDelMes(parseInt(S.activeYear),mes).reduce((s,w)=>s+caixaSetSortides(w[0]),0));}
function efectiuRealMes(mes){return r2(totalsMes(mes).ef-caixaSortidesMes(mes));}
function caixaEfectiuMes(mes){
  if(mes<CAIXA_DES)return 0;
  const prev=mes>CAIXA_DES?caixaEfectiuMes(mes-1):0;
  return r2(prev+efectiuRealMes(mes)+caixaAjustMes(mes));
}
/* Data que decideix a quin mes compta un moviment del banc.
   Els ingressos de TPV van al mes de la SETMANA de la venda (mana el dimecres, igual que al
   dietari): el banc diposita amb retard i un ingrés del 3 d'agost pot ser d'una setmana de
   juliol. La resta de moviments compten al mes de la seva data, com sempre. */
function ccDataMes(m){
  const c=ccCatByRole('tpv');
  if(c&&m.catId===c.id){
    const base=m.tpvData||m.data;
    if(base)return setmanaDe(base)[2];   // el dimecres de la setmana marca el mes
  }
  return m.data;
}
/* La setmana a la qual s'ha assignat un moviment, si no és la de la seva pròpia data */
function ccSetmanaMoguda(m){
  const d=ccDataMes(m);
  if(!d||mesDeIso(d)===mesDeIso(m.data))return null;
  const w=setmanaDe(m.tpvData||m.data);
  return rangCurt(w[0],w[5]);
}
function ccDelMes(mes){const p=S.activeYear+'-'+String(mes+1).padStart(2,'0');return Y().cc.filter(m=>m.data&&ccDataMes(m).startsWith(p));}
function despCCMes(mes){if(esHistoric())return histMes(mes,'dcc');const c=ccCatByRole('despcc');if(!c)return 0;return ccDelMes(mes).filter(m=>m.catId===c.id&&m.estat!=='Cancelat').reduce((s,m)=>s+num(m.debe),0);}
function ingresTpvBancMes(mes){const c=ccCatByRole('tpv');if(!c)return 0;return ccDelMes(mes).filter(m=>m.catId===c.id&&m.estat!=='Cancelat').reduce((s,m)=>s+num(m.haber),0);}

function infoDiaHTML(ds){

}
function bindAvui(){
  if(esHistoric())return;   // any històric: no hi ha formulari a lligar
  const ds0=ctx.data||hui();
  // Llegeix l'estat actual dels camps d'un bloc cap a avuiLines (preserva el que s'escriu)
  const readBlock=key=>{const arr=[];
    document.querySelectorAll('.lrow[data-k="'+key+'"]').forEach(row=>{
      arr.push({imp:row.querySelector('.li-imp').value,c:row.querySelector('.li-c').value,rec:row.querySelector('.li-rec').checked,
        quant:row.querySelector('.li-quant').value,unitat:row.querySelector('.li-unitat').value});});
    return arr;};
  const syncLines=()=>{['fp','fpl','desp'].forEach(k=>{avuiLines[k]=readBlock(k);});};
  const renderBlock=key=>{const cap=key.charAt(0).toUpperCase()+key.slice(1);document.getElementById('blk'+cap).innerHTML=lineBlockHTML(key);};
  const recalc=()=>{
    const tpvBrut=num($('#f_tpv').value), tpvBanc=tpvBancDia(ds0), tpvNet=tpvBanc>0?tpvBanc:tpvBrut;
    let r=num($('#f_ef').value)+tpvNet;
    ['fp','fpl','desp'].forEach(key=>{let s=0;
      document.querySelectorAll('.lrow[data-k="'+key+'"]').forEach(row=>{
        const v=num(row.querySelector('.li-imp').value); s+=v;
        if(row.querySelector('.li-rec').checked)r+=v;});
      const el=document.getElementById('sum_'+key); if(el)el.textContent=eur0(s);});
    r+=factDiaRec(ds0)+despCCDiaRec(ds0);
    $('#recVal').textContent=eur0(r);
    const info=$('#tpvInfo');
    if(info){const com=tpvBrut-tpvBanc, pct=tpvBrut?(100*com/tpvBrut).toFixed(1):'0';
      info.textContent=tpvBanc>0?('TPV net del banc: '+eur0(tpvBanc)+' · comissió: '+eur0(com)+' ('+pct+'%)'):(tpvBrut?'TPV en brut (la comissió es descompta al total del mes)':'');}
  };
  ['f_ef','f_tpv'].forEach(id=>$('#'+id).addEventListener('input',recalc));
  // Delegació d'esdeveniments al card (sobreviu als re-renders dels blocs)
  const card=$('#cardAvui');
  card.addEventListener('input',e=>{if(e.target.closest('.lrow'))recalc();});
  card.addEventListener('change',e=>{if(e.target.classList.contains('li-rec'))recalc();});
  card.addEventListener('click',e=>{
    const add=e.target.closest('.li-add');
    if(add){const k=add.dataset.k; syncLines(); avuiLines[k].push({imp:'',c:'',rec:false,quant:'',unitat:''}); renderBlock(k); recalc(); return;}
    const del=e.target.closest('.li-del');
    if(del){const row=del.closest('.lrow'); const k=row.dataset.k; const i=parseInt(row.dataset.i); syncLines(); avuiLines[k].splice(i,1); renderBlock(k); recalc(); return;}
  });
  // Enllaços (banc i factures): la casella «rec» decideix si compten a la recaptació
  const cardEx=$('#cardEnllacos');
  if(cardEx){
    cardEx.addEventListener('change',e=>{
      if(!e.target.classList.contains('ex-rec'))return;
      const row=e.target.closest('.lrow'), src=row.dataset.src, id=row.dataset.id, on=e.target.checked;
      if(src==='fact'){const f=Y().factures.find(x=>x.id===id); if(f){f.recDia=on; save();}}
      else if(src==='cc'){const m=Y().cc.find(x=>x.id===id); if(m){m.recDia=on; save();}}
      recalc();
    });
    cardEx.addEventListener('click',e=>{
      const op=e.target.closest('.ex-open'); if(!op)return;
      const row=op.closest('.lrow'), src=row.dataset.src, id=row.dataset.id;
      if(src==='fact'){const f=Y().factures.find(x=>x.id===id); if(f)formFactura(f);}
      else if(src==='cc'){const m=Y().cc.find(x=>x.id===id); if(m)formCC(m);}
    });
  }
  recalc();
  $('#f_data').addEventListener('change',()=>{
    const ds=$('#f_data').value; if(!ds)return;
    if(ds.slice(0,4)!==S.activeYear){alert('Aquesta data no és de l\'any actiu ('+S.activeYear+'). Canvia l\'any a dalt si cal.');}
    go('avui',{data:ds});
  });
  $('#desaDia').addEventListener('click',()=>{
    const ds=$('#f_data').value;
    if(!ds){alert('Falta la data.');return;}
    if(ds.slice(0,4)!==S.activeYear){alert('La data ha de ser de l\'any actiu ('+S.activeYear+').');return;}
    syncLines();
    const netLines=arr=>arr.map(l=>({imp:numOrNull(l.imp),c:(l.c||'').trim(),rec:!!l.rec,quant:numOrNull(l.quant),unitat:(l.unitat||'').trim()}))
      .filter(l=>l.imp!=null||l.c||l.quant!=null||l.unitat).map(l=>({imp:l.imp==null?0:l.imp,c:l.c,rec:l.rec,quant:l.quant,unitat:l.unitat}));
    const d={ef:numOrNull($('#f_ef').value),tpv:numOrNull($('#f_tpv').value),
      fpLines:netLines(avuiLines.fp),fplLines:netLines(avuiLines.fpl),despLines:netLines(avuiLines.desp),
      obs:$('#f_obs').value.trim()};
    if(!diaTeRes(d)){delete Y().dies[ds];}
    else Y().dies[ds]=d;
    save();
    go('dietari',{mes:mesDeIso(ds)});
  });
  // resum de la setmana en curs (Dl–Ds del dilluns d'aquest dia)
  const setm=setmanaDe(ds0);
  if(setm){
    const t=totalsRang(setm), dccSet=setm.reduce((s,ds)=>s+despCCDia(ds).reduce((a,m)=>a+num(m.debe),0),0);
    const tpvNetSet=tpvNetRang(setm), comSet=comissioTpvRang(setm);
    $('#resumSetmanaAvui').innerHTML='<h3>Setmana ('+dataCA(setm[0])+' – '+dataCA(setm[setm.length-1])+')</h3>'+
      kpiGridWk([['Recaptació',eur0(t.rec),'rec'],['Efectiu',eur0(efectiuRealSet(setm)),'ef'],['TPV net',eur0(tpvNetSet),'tpvnet'],['Comissió TPV',eur0(comSet),'comtpv'],['Despeses',eur0(t.desp),'desp'],['Fp',eur0(t.fp),'fp'],['FpL',eur0(t.fpl),'fpl'],['Despeses c/c',eur0(dccSet),'dcc']],setm[0])+
      '<p class="muted" style="margin:6px 2px 0">Clica una xifra per veure d\'on surt. La comissió de la setmana és només informativa: als totals del mes es descompta un sol cop, com sempre.</p>';
    bindWk($('#resumSetmanaAvui'));
  } else $('#resumSetmanaAvui').remove();
}
function kpiGrid(pars){return '<div class="kpis">'+pars.map(([l,v])=>'<div class="kpi"><div class="l">'+l+'</div><div class="v num">'+v+'</div></div>').join('')+'</div>';}
/* KpiGrid amb cel·les clicables: cada parell pot dur un 3r element 'camp' que obre el detall setmanal */
function kpiGridWk(pars,monIso){return '<div class="kpis">'+pars.map(([l,v,camp])=>'<div class="kpi'+(camp?' clickable':'')+'"'+(camp?' data-wk="'+monIso+'|'+camp+'"':'')+'><div class="l">'+l+(camp?' <span class="muted">›</span>':'')+'</div><div class="v num">'+v+'</div></div>').join('')+'</div>';}
/* L'efectiu de la setmana obre la calculadora (detall dia a dia + el que s'ha utilitzat);
   la resta de camps obren el detall de sempre. */
function bindWk(root){(root||document).querySelectorAll('[data-wk]').forEach(el=>el.addEventListener('click',e=>{
  e.stopPropagation();const p=el.dataset.wk.split('|');
  if(p[1]==='ef')obreCaixaSetmana(p[0]); else obreBreakdownSetmana(p[0],p[1]);
}));}
/* ---- Detall d'on surt cada xifra del resum setmanal ---- */
const CAMP_NOM={ef:'Efectiu',tpv:'TPV',tpvnet:'TPV net',comtpv:'Comissió TPV',rec:'Recaptació',desp:'Despeses',fp:'Fp',fpl:'FpL',dcc:'Despeses c/c'};
function liniesCamp(ds,camp){
  const d=dia(ds); const out=[];
  const catOl=id=>{const p=(Y().olivesCat||[]).find(x=>x.id===id);return p?p.nom:'oliva';};
  if(camp==='ef'){ if(d&&d.ef!=null)out.push({desc:'Efectiu',imp:num(d.ef)}); }
  else if(camp==='tpv'){
    if(d&&d.tpv!=null){out.push({desc:'TPV brut',imp:num(d.tpv)});
      const c=comissioTpvDia(d,ds); if(c)out.push({desc:'Comissió TPV',imp:-c,muted:true});}
  }
  else if(camp==='tpvnet'){ // aquí la comissió SÍ que resta: el total ha de donar el net
    if(d&&d.tpv!=null){out.push({desc:'TPV brut',imp:num(d.tpv)});
      const c=comissioTpvDia(d,ds); if(c)out.push({desc:'− Comissió que descompta el banc',imp:-c});}
  }
  else if(camp==='comtpv'){
    const c=comissioTpvDia(d,ds);
    if(c)out.push({desc:'Brut '+eur0(d?num(d.tpv):0)+' − ingrés al banc '+eur0(tpvBancDia(ds)),imp:c});
  }
  else if(camp==='fp'){
    (d&&d.fpLines||[]).forEach(l=>out.push({desc:l.c||'Fp del dia',imp:num(l.imp),rec:!!l.rec}));
    factPagsDia(ds).filter(x=>factBlock(x.f)==='fp').forEach(x=>out.push({desc:'Factura #'+(x.f.num??'')+' '+(x.f.empresa||x.f.concepte||'')+(x.talo?' · taló '+x.talo:''),imp:num(x.imp),rec:!!x.f.recDia}));
    (Y().olivesCompres||[]).filter(c=>c.bloc==='fp'&&c.set&&olDissabte(c.set)===ds).forEach(c=>out.push({desc:'Olives · '+catOl(c.prod),imp:num(c.imp)}));
  }
  else if(camp==='fpl'){
    (d&&d.fplLines||[]).forEach(l=>out.push({desc:l.c||'FpL del dia',imp:num(l.imp),rec:!!l.rec}));
    factPagsDia(ds).filter(x=>factBlock(x.f)==='fpl').forEach(x=>out.push({desc:'Factura #'+(x.f.num??'')+' '+(x.f.empresa||x.f.concepte||'')+(x.talo?' · taló '+x.talo:''),imp:num(x.imp),rec:!!x.f.recDia}));
    (Y().olivesCompres||[]).filter(c=>c.bloc==='fpl'&&c.set&&olDissabte(c.set)===ds).forEach(c=>out.push({desc:'Olives · '+catOl(c.prod),imp:num(c.imp)}));
  }
  else if(camp==='desp'){
    (d&&d.despLines||[]).forEach(l=>out.push({desc:l.c||'Despeses del dia',imp:num(l.imp),rec:!!l.rec}));
    factPagsDia(ds).filter(x=>factBlock(x.f)==='desp').forEach(x=>out.push({desc:'Factura #'+(x.f.num??'')+' '+(x.f.empresa||x.f.concepte||'')+(x.talo?' · taló '+x.talo:''),imp:num(x.imp),rec:!!x.f.recDia}));
  }
  else if(camp==='dcc'){ despCCDia(ds).forEach(m=>out.push({desc:m.concepte||'Despesa c/c',imp:num(m.debe)})); }
  else if(camp==='rec'){
    if(d&&d.ef)out.push({desc:'Efectiu',imp:num(d.ef)});
    const net=tpvNetDia(d,ds), com=comissioTpvDia(d,ds);
    if(net||com)out.push({desc:'TPV net'+(com?' (brut '+eur0(d?num(d.tpv):0)+' − comissió '+eur0(com)+')':''),imp:net});
    (d&&d.fpLines||[]).filter(l=>l.rec).forEach(l=>out.push({desc:'Fp · '+(l.c||'del dia'),imp:num(l.imp)}));
    (d&&d.fplLines||[]).filter(l=>l.rec).forEach(l=>out.push({desc:'FpL · '+(l.c||'del dia'),imp:num(l.imp)}));
    (d&&d.despLines||[]).filter(l=>l.rec).forEach(l=>out.push({desc:'Despeses · '+(l.c||'del dia'),imp:num(l.imp)}));
    factPagsDia(ds).filter(x=>x.f.recDia).forEach(x=>out.push({desc:'Factura #'+(x.f.num??'')+(x.talo?' · taló '+x.talo:''),imp:num(x.imp)}));
    despCCDia(ds).filter(m=>m.recDia).forEach(m=>out.push({desc:'c/c · '+(m.concepte||''),imp:num(m.debe)}));
  }
  return out;
}
function breakdownSetmanaHTML(w,camp){
  const showRec=(camp==='fp'||camp==='fpl'||camp==='desp');
  let h='<div class="scrollx"><table><thead><tr><th>Dia</th><th>D\'on surt</th><th class="n">Import</th>'+(showRec?'<th>rec</th>':'')+'</tr></thead><tbody>';
  let tot=0, hi=false;
  w.forEach(ds=>{
    const ls=liniesCamp(ds,camp); if(!ls.length)return; hi=true;
    const dow=(new Date(ds+'T12:00').getDay()+6)%7;
    ls.forEach((l,i)=>{ if(!l.muted)tot+=l.imp;
      h+=`<tr${l.muted?' class="muted"':''}><td>${i===0?DIES[dow]+' '+parseInt(ds.slice(8)):''}</td><td>${esc(l.desc)}</td><td class="n">${eur0(l.imp)}</td>${showRec?'<td>'+(l.rec===true?'sí':l.rec===false?'no':'')+'</td>':''}</tr>`;
    });
  });
  if(!hi)h+='<tr><td colspan="'+(showRec?4:3)+'" class="muted">Cap moviment aquesta setmana.</td></tr>';
  h+=`<tr class="total"><td colspan="2">Total setmana</td><td class="n">${eur0(tot)}</td>${showRec?'<td></td>':''}</tr></tbody></table></div>`;
  if(camp==='rec')h+='<p class="muted">Recaptació = per cada dia: efectiu + TPV net (brut − comissió) + línies de Fp/FpL/Despeses marcades «rec» + factures i despeses c/c marcades «rec».</p>';
  else if(camp==='tpv')h+='<p class="muted">El TPV brut compta sencer al total de TPV. La comissió es resta a la recaptació (TPV net = brut − comissió).</p>';
  else if(camp==='tpvnet')h+='<p class="muted">TPV net = el que el banc t\'ingressa de veritat (brut menys la comissió que et descompta). Si un dia no hi ha ingrés del banc, el net és igual al brut.</p>';
  else if(camp==='comtpv')h+='<p class="muted">Xifra informativa: la comissió de cada dia surt de comparar el TPV brut amb l\'ingrés del banc. Als totals del mes la comissió es descompta un sol cop, amb el sistema mensual de sempre.</p>';
  else if(showRec)h+='<p class="muted">Les línies «rec: no» (factures grosses/talons de la setmana) sumen al total de '+CAMP_NOM[camp]+' però no a la recaptació.</p>';
  return h;
}
/* ---- Calculadora d'efectiu de la setmana: el que ha entrat menys el que s'ha anat utilitzant ---- */
function cxsRowHTML(l){return `<div class="lrow cxs-row" style="grid-template-columns:88px 1fr auto">
  <input class="num cxs-imp" inputmode="decimal" placeholder="0,00" value="${l&&l.imp!=null&&l.imp!==''?l.imp:''}">
  <input class="cxs-c" placeholder="en què (pagament, canvi…)" value="${esc((l&&l.c)||'')}">
  <button class="small cxs-del" type="button" aria-label="Esborra la línia">✕</button>
</div>`;}
function obreCaixaSetmana(monIso){
  const w=setmanaDe(monIso); if(!w)return;
  const brut=totalsRang(w).ef;
  const lines=caixaSetLines(monIso).map(l=>({...l}));
  const cos=breakdownSetmanaHTML(w,'ef')+
    `<h3 style="margin-top:14px">Efectiu que has utilitzat</h3>
    <p class="muted" style="margin:0 0 8px">Apunta el que vas traient de la caixa durant la setmana. Es resta de l'efectiu de dalt i el que queda és el que suma a la caixa d'efectiu del mes. No toca la recaptació ni les despeses.</p>
    <div id="cxs_cont">${(lines.length?lines:[{c:'',imp:''}]).map(cxsRowHTML).join('')}</div>
    <button class="small" id="cxs_add" type="button">+ línia</button>
    <div class="recline"><span class="l">Efectiu de la setmana</span><span class="v num">${eur0(brut)}</span></div>
    <div class="recline"><span class="l">− Efectiu utilitzat</span><span class="v num" id="cxs_out">—</span></div>
    <div class="recline"><span class="l"><b>Efectiu real</b></span><span class="v num" id="cxs_real">—</span></div>
    <button class="primary" id="cxs_desa" style="margin-top:8px">Desa</button>`;
  modal(mTitle('Efectiu · setmana '+dataCA(w[0])+' – '+dataCA(w[5]))+cos,el=>{
    const cont=el.querySelector('#cxs_cont');
    const read=()=>[...cont.querySelectorAll('.cxs-row')].map(r=>({c:r.querySelector('.cxs-c').value.trim(),imp:numOrNull(r.querySelector('.cxs-imp').value)}));
    const recalc=()=>{const out=r2(read().reduce((s,l)=>s+num(l.imp),0));
      el.querySelector('#cxs_out').textContent=eur0(out);
      el.querySelector('#cxs_real').textContent=eur0(r2(brut-out));};
    const rerender=arr=>{cont.innerHTML=(arr.length?arr:[{c:'',imp:''}]).map(cxsRowHTML).join('');recalc();};
    cont.addEventListener('input',recalc);
    cont.addEventListener('click',e=>{const d=e.target.closest('.cxs-del');if(!d)return;
      const arr=read(); const i=[...cont.querySelectorAll('.cxs-row')].indexOf(d.closest('.cxs-row'));
      arr.splice(i,1); rerender(arr);});
    el.querySelector('#cxs_add').addEventListener('click',()=>{const arr=read();arr.push({c:'',imp:''});rerender(arr);});
    recalc();
    el.querySelector('#cxs_desa').addEventListener('click',()=>{
      const arr=read().filter(l=>l.imp!=null||l.c).map(l=>({c:l.c,imp:l.imp==null?0:l.imp}));
      if(!Y().caixaSet)Y().caixaSet={};
      if(arr.length)Y().caixaSet[monIso]=arr; else delete Y().caixaSet[monIso];
      save(); tancaModal(); render();
    });
    bindResumLinks(el);
  });
}
function obreBreakdownSetmana(monIso,camp,backMes){const w=setmanaDe(monIso);
  const back=(backMes!=null&&!isNaN(backMes))?'<button class="small" id="bkMes" style="margin-bottom:10px">‹ Torna a '+MESOS[backMes]+'</button>':'';
  modal(mTitle(CAMP_NOM[camp]+' · setmana '+dataCA(w[0])+' – '+dataCA(w[5]))+back+breakdownSetmanaHTML(w,camp),el=>{
    const b=el.querySelector('#bkMes'); if(b)b.addEventListener('click',()=>obreBreakdownMes(backMes,camp));
    bindResumLinks(el);});}
/* ---- Detall del total del MES: per setmanes, i cada setmana es pot obrir línia a línia ---- */

function vDietari(){
  const sub=ctx.sub==='any'?'any':'mes';

      h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.88rem">
        <span class="muted">Tancament ds. ${dataCA(sat)}${tc?' · caixa '+eur0(tc.caixa)+' · banc '+eur0(tc.banc):''}</span>

  // Gen–jun (comissió manual): el TPV desat és el NET → brut = net + comissió.

    '<p class="muted" style="margin:6px 2px 0">El TPV net és el que compta a la recaptació. El brut = net + comissió (informatiu).</p></div>';
  if(mes>=CAIXA_DES){
    const efAcum=caixaEfectiuMes(mes), ajust=caixaAjustMes(mes), banc=caixaBancariMes(mes);
    const pend=facturesPendentsTotal(), totalAcum=r2((banc||0)+efAcum-pend);
    h+=`<div class="card"><h3>Caixa d'efectiu <span class="muted" style="font-weight:400;font-size:.8rem">(clica per veure d'on surt)</span></h3>
      <div class="kpi clickable" data-caixatot="${mes}" style="margin-bottom:6px"><div class="l">Efectiu acumulat</div><div class="v num">${eur0(totalAcum)}</div></div>
      <div class="kpi clickable" data-caixaef="${mes}" style="margin-bottom:10px"><div class="l">Efectiu normal</div><div class="v num">${eur0(efAcum)}</div></div>
      <div class="row2">
        <div><label for="cx_ajust">Ajust (+/−)</label><input id="cx_ajust" class="num" inputmode="decimal" value="${ajust||''}"></div>
        <div><label for="cx_banc">Efectiu bancari</label><input id="cx_banc" class="num" inputmode="decimal" value="${banc??''}"></div>
      </div>
      <button class="primary" id="cx_desa" data-mes="${mes}" style="margin-top:8px">Desa</button>
      <p class="muted" style="margin:6px 2px 0">Efectiu acumulat = efectiu bancari + efectiu normal − factures pendents de pagar. L'efectiu normal comença amb l'acumulat del mes anterior i hi suma l'efectiu real de cada setmana (el que ha entrat menys el que has utilitzat, que apuntes clicant l'efectiu de la setmana); l'efectiu bancari és un valor a part, sense fórmula.</p>
    </div>`;
  }
  return h;
}

const CC_SEED=[{id:'despcc',nom:'Despeses cc',role:'despcc'},{id:'tpv',nom:'TPV',role:'tpv'},{id:'pagfact',nom:'Pagament de factures',role:'pagfact'},{id:'fpl',nom:'FpL',role:null},{id:'ingres',nom:'Ingrés',role:null},{id:'altres',nom:'Altres',role:null}];
function ccCats(){if(!S.ccCats||!S.ccCats.length)S.ccCats=JSON.parse(JSON.stringify(CC_SEED));return S.ccCats;}
function ccCat(id){return ccCats().find(c=>c.id===id)||null;}
function ccCatByRole(role){return ccCats().find(c=>c.role===role)||null;}
function ccCatNom(m){const c=ccCat(m.catId);return c?c.nom:(m.categoria||'—');}
function migra(){
  ccCats();
  // categoria pròpia dels pagaments de factures que es porten al banc (no és «Despeses cc»,
  // perquè aquestes factures ja compten al dietari pel seu bloc de Fp/FpL/Despeses)
  if(!ccCatByRole('pagfact')&&!ccCat('pagfact'))ccCats().push({id:'pagfact',nom:'Pagament de factures',role:'pagfact'});
  // Els anys històrics han d'existir al selector; les xifres viuen a HISTORIC, no aquí
  Object.keys(HISTORIC).forEach(a=>{if(!S.years[a])S.years[a]=anyBuit();});
  // «Altres» va passar de ser només un llistat d'inventari a ser un tipus de compra amb factures
  Object.values(S.years||{}).forEach(y=>{if(!Array.isArray(y.altres))y.altres=[];});
  if(S.compresNoms&&S.compresNoms.inventari&&!S.compresNoms.altres){S.compresNoms.altres=S.compresNoms.inventari;delete S.compresNoms.inventari;}
  const byName={}; ccCats().forEach(c=>byName[c.nom.toLowerCase()]=c.id);
  Object.values(S.years||{}).forEach(y=>{(y.cc||[]).forEach(m=>{
    if(!m.catId){m.catId=byName[(m.categoria||'').toLowerCase()]||'altres';}
  });});
  migraDies();
  migraCompres();
  migraComissio();
  migraProveidors();
}
/* Unifica proveïdors amb grafies diferents detectades a les dades ("Olivas center" / "Olivas Center").
   Afegeix-hi més entrades si es detecten altres duplicats. Idempotent. */
const PROV_CANONIC={'olivas center':'Olivas Center'};
function migraProveidors(){
  const fix=v=>{if(!v)return v;const c=PROV_CANONIC[v.trim().toLowerCase()];return c||v;};
  Object.values(S.years||{}).forEach(y=>{
    (y.factures||[]).forEach(f=>{if(f.empresa)f.empresa=fix(f.empresa);});
    (y.bacalla||[]).forEach(r=>{if(r.prov)r.prov=fix(r.prov);});
    (y.conserva||[]).forEach(r=>{if(r.prov)r.prov=fix(r.prov);});
  });
}
/* Comissió TPV: del model antic (repartida per dia, d.comTpv) al mensual (y.comTpvMes).
   Per al 2026 gen–jun desa les xifres reals del resum de l'Excel. Idempotent. Juliol es deixa a mà. */
const COM_TPV_2026={0:60.28,1:73.44,2:150.34,3:90.96,4:63.66,5:57.93};
function migraComissio(){
  Object.values(S.years||{}).forEach(y=>{
    if(y.comTpvMes==null)y.comTpvMes={};
    Object.values(y.dies||{}).forEach(d=>{
      if(d.comTpv!=null)delete d.comTpv;
      // Treu línies de comissió d'imports antics que restaven la comissió a la recaptació (doble resta)
      ['despLines','fpLines','fplLines'].forEach(k=>{if(Array.isArray(d[k]))d[k]=d[k].filter(l=>!/comiss/i.test(l.c||''));});
    });
  });
  const y=S.years&&S.years['2026'];
  if(y&&!y._comMes26){
    Object.keys(COM_TPV_2026).forEach(m=>{if(y.comTpvMes[m]==null)y.comTpvMes[m]=COM_TPV_2026[m];});
    y._comMes26=true;
  }
}
/* Migra compres d'un sol producte (bacallà/conserva antics) a factura amb llista de productes. Idempotent. */
function migraCompres(){
  Object.values(S.years||{}).forEach(y=>{
    (y.bacalla||[]).forEach(r=>{if(!r.productes){r.productes=[{producte:r.tipus||'',qty:r.kg,imp:r.imp,pv:r.pv}];if(r.dataPag&&!r.data)r.data=r.dataPag;delete r.tipus;delete r.kg;delete r.imp;delete r.pv;delete r.dataPag;}});
    (y.conserva||[]).forEach(r=>{if(!r.productes){r.productes=[{producte:r.nom||'',qty:r.unitats,imp:r.costTotal,pv:r.pv}];delete r.nom;delete r.unitats;delete r.costTotal;}});
    if(y.factures)y.factures=y.factures.filter(f=>!(f.auto&&f.srcType==='oliva')); // les olives ja no generen factura
  });
}
/* Migra dies de valor únic (fp/fpl/desp + fpRec/fplRec) a línies múltiples. Idempotent. */
function migraDies(){
  Object.values(S.years||{}).forEach(y=>{
    Object.values(y.dies||{}).forEach(d=>{
      if(d.fpLines==null){ d.fpLines = d.fp!=null?[{imp:num(d.fp),c:'',rec:!!d.fpRec}]:[]; }
      if(d.fplLines==null){ d.fplLines = d.fpl!=null?[{imp:num(d.fpl),c:'',rec:!!d.fplRec}]:[]; }
      if(d.despLines==null){ d.despLines = d.desp!=null?[{imp:num(d.desp),c:'',rec:false}]:[]; }
      delete d.fp; delete d.fpl; delete d.desp; delete d.fpRec; delete d.fplRec;
    });
  });
}

function bindPdfFormat(el,f0){
  const v=el.querySelector('#pf_view'); if(v)v.addEventListener('click',()=>{if(f0&&f0.pdf)obrePdf(f0.pdf);});
  let treu=false;
  const d=el.querySelector('#pf_del'); if(d)d.addEventListener('click',()=>{treu=true;d.textContent='Es treurà en desar';d.disabled=true;});
  // Retorna una funció async que aplica format + fitxer a l'objecte factura abans de desar
  return async f=>{
    f.format=el.querySelector('#pf_format').value||'';
    if(treu&&f.pdf){try{await sb.storage.from('factures').remove([f.pdf]);}catch(e){} f.pdf='';}
    const file=el.querySelector('#pf_file').files[0];
    if(file){
      const ext=((file.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,''))||'pdf';
      const path=(typeof sbUser!=='undefined'&&sbUser?sbUser.id+'/':'')+f.id+'.'+ext;
      const {error}=await sb.storage.from('factures').upload(path,file,{upsert:true});
      if(error){alert('Les dades es desen, però el fitxer NO s\'ha pujat: '+error.message+'\n\nSi és el primer cop, cal crear el dipòsit (bucket) "factures" a Supabase → Storage.');return;}
      f.pdf=path;
    }
  };
}
function formFactura(f){
  const nou=!f;
  const numSeg=Y().factures.reduce((m,x)=>Math.max(m,num(x.num)),0)+1;
  f=f||{num:numSeg,imp:'',concepte:'Bacallà',categoria:'FpL',estat:'Pendent',mode:'Taló',talo:'',dataPagISO:'',recDia:false,empresa:'',obs:'',format:'',pdf:''};
  modal(mTitle(nou?'Nova factura':'Edita factura')+`
    <label>Núm. intern</label><input id="x_num" class="num" inputmode="numeric" value="${f.num??''}">
    <label>Proveïdor</label><input id="x_emp" value="${esc(f.empresa||f.ref||'')}" list="dl_provs">
    <datalist id="dl_provs">${dlOpts(provList())}</datalist>
    <div class="row2">
      <div><label>Import total</label><input id="x_imp" class="num" inputmode="decimal" value="${f.imp??''}"></div>
      <div><label>Concepte</label><select id="x_conc">${F_CONCEPTES.map(c=>`<option ${c===f.concepte?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div><label>Categoria</label><select id="x_cat">${F_CATS.map(c=>`<option ${c===f.categoria?'selected':''}>${c}</option>`).join('')}</select></div>
      <div><label>Mode de pagament</label><select id="x_mode">${F_MODES.map(c=>`<option ${c===f.mode?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    ${paysSectionHTML(factPags(f).map(p=>({...p})))}
    ${pdfFormatHTML(f)}
    <label>Observacions</label><textarea id="x_obs">${esc(f.obs||'')}</textarea>
    <button class="primary" id="x_desa">Desa</button>
    ${(nou||f.auto)?'':`<div class="lineblk" style="margin-top:12px">
      <div class="lbhead"><span class="lbtitle">Converteix en compra</span></div>
      <p class="muted" style="margin:0 0 6px">Passa aquesta factura a Compres perquè els quilos comptin als subtotals. Manté el número, els pagaments i el PDF. Desa primer si has canviat res.</p>
      <div class="row3">
        <select id="x_cvtipus"><option value="bacalla">Bacallà</option><option value="conserva">Conserva</option><option value="altres">Altres</option></select>
        <input id="x_cvprod" placeholder="Producte (Filet…)">
        <input id="x_cvqty" class="num" inputmode="decimal" placeholder="Quantitat">
      </div>
      <input id="x_cvunitat" list="dl_unitats_compra" placeholder="unitat (kg, caixes…)" style="display:none;margin-top:6px">
      <datalist id="dl_unitats_compra">${dlOpts(unitatsCompra())}</datalist>
      <button class="small" id="x_cvt" type="button" style="margin-top:6px">Converteix en compra</button>
    </div>`}
    ${nou?'':'<button class="danger" id="x_del" style="width:100%;margin-top:8px">Elimina</button>'}
  `,el=>{
    const readPagaments=bindPaysSection(el,()=>el.querySelector('#x_imp').value);
    const aplicaPdf=bindPdfFormat(el,f);
    el.querySelector('#x_desa').addEventListener('click',async()=>{
      const pagaments=readPagaments();
      if(pagaments.some(p=>num(p.imp)&&!p.data)){alert('Hi ha un pagament amb import però sense data.');return;}
      const obj={id:f.id||uid(),num:numOrNull(el.querySelector('#x_num').value),
        empresa:el.querySelector('#x_emp').value.trim(),imp:numOrNull(el.querySelector('#x_imp').value),
        concepte:el.querySelector('#x_conc').value,categoria:el.querySelector('#x_cat').value,
        mode:el.querySelector('#x_mode').value,recDia:!!f.recDia,
        obs:el.querySelector('#x_obs').value.trim(),format:f.format||'',pdf:f.pdf||''};
      if(obj.imp==null){alert('Falta l\'import total.');return;}
      if(obj.num!=null){ // avisa si el número ja el fa servir una altra factura
        const dup=Y().factures.find(x=>num(x.num)===obj.num&&x.id!==obj.id);
        if(dup&&!confirm('Ja hi ha una altra factura amb el número '+obj.num+(dup.empresa?' ('+dup.empresa+')':'')+'.\n\nVols desar-la igualment amb aquest número?'))return;
      }
      aplicaPagaments(obj,pagaments);           // pagaments + estat (Pendent/Parcial/Pagat) + compat
      await aplicaPdf(obj);
      if(f.id){const i=Y().factures.findIndex(x=>x.id===f.id);Y().factures[i]=obj;}else Y().factures.push(obj);
      sincronitzaApuntsBanc(obj);
      save();tancaModal();render();
    });
    /* Converteix una factura normal en compra de bacallà/conserva: crea el registre a Compres
       amb els quilos i hi lliga aquesta mateixa factura (no en duplica cap). */
    const cvTipus=el.querySelector('#x_cvtipus');
    if(cvTipus)cvTipus.addEventListener('change',()=>{
      el.querySelector('#x_cvunitat').style.display=COMPRA_CFG[cvTipus.value].unitatLliure?'':'none';
    });
    const cvt=el.querySelector('#x_cvt');
    if(cvt)cvt.addEventListener('click',()=>{
      const type=el.querySelector('#x_cvtipus').value, cfg=COMPRA_CFG[type];
      const prod=el.querySelector('#x_cvprod').value.trim();
      const qty=numOrNull(el.querySelector('#x_cvqty').value);
      const imp=numOrNull(el.querySelector('#x_imp').value);
      const unitat=cfg.unitatLliure?el.querySelector('#x_cvunitat').value.trim():'';
      if(!prod){alert('Falta el nom del producte.');return;}
      if(qty==null||qty<=0){alert('Falta la quantitat ('+cfg.qtyLab.toLowerCase()+').');return;}
      if(cfg.unitatLliure&&!unitat){alert('Falta la unitat (kg, caixes, unitats…).');return;}
      if(imp==null){alert('Falta l\'import total.');return;}
      if(!confirm('Convertir la factura #'+(f.num??'—')+' en una compra '+deTitol(type)+':\n'+
        prod+' · '+qty+' '+(unitat||cfg.qtyLab.toLowerCase())+' · '+eur0(imp)+
        '\n\nLa factura es manté (mateix número i pagaments) i queda lligada a la compra.'))return;
      const r={id:uid(),prov:el.querySelector('#x_emp').value.trim(),data:f.dataPagISO||'',
        diaCat:['Despeses','FpL','Fp'].includes(f.categoria)?f.categoria:'FpL',
        productes:[{producte:prod,qty:qty,imp:imp,pv:null,iva:null,unitat:unitat}]};
      if(!Array.isArray(Y()[type]))Y()[type]=[];
      Y()[type].push(r);
      const fx=Y().factures.find(x=>x.id===f.id);
      if(fx){fx.auto=true;fx.srcType=type;fx.srcId=r.id;}
      save();tancaModal();go('compres',{tab:type,sub:'quatri'});
    });
    const del=el.querySelector('#x_del');
    if(del)del.addEventListener('click',()=>{if(confirm('Eliminar aquesta factura?')){
      if(f.pdf){try{sb.storage.from('factures').remove([f.pdf]);}catch(e){}}
      esborraApuntsBanc(f.id);
      Y().factures=Y().factures.filter(x=>x.id!==f.id);save();tancaModal();render();}});
  });
}

/* ================= VISTA: MÉS (menú) ================= */
function vMes(){
  const its=[['tresoreria','◑','Resum de tresoreria'],['exporta','⇩','Exporta a Excel (.xlsx)'],
    ['copia','⛃','Còpia de seguretat (JSON)'],['config','⚙','Configuració i anys']];
  return '<h2>Més</h2><div class="card tight menu">'+its.map(([v,ic,t])=>
    `<div class="item" data-go="${v}"><div class="t"><span class="ic">${ic}</span>${t}</div><div class="muted">›</div></div>`).join('')+'</div>';
}
function bindMes(){
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const v=el.dataset.go;
    if(v==='exporta')exportaXLSX();
    else if(v==='compres')go('compres',{tab:'bacalla'});
    else go(v);
  }));
}

/* ================= VISTA: COMPRES ================= */
function vCompres(){
  const tab=ctx.tab||'bacalla'; ctx.tab=tab;
  let h=`<h2>Compres</h2><div class="subtabs">
    ${COMPRES_TABS.map(([k])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${esc(tabNom(k))}</button>`).join('')}</div>`;
  if(tab==='bacalla')h+=vBacalla();
  else if(tab==='olives')h+=vOlives();
  else if(tab==='conserva')h+=vConserva();
  else h+=vCompra('altres');
  return h;
}
function trimestre(isoStr){return isoStr?Math.floor((parseInt(isoStr.slice(5,7))-1)/3)+1:null;}
function quatri(iso){return iso?Math.floor((parseInt(iso.slice(5,7))-1)/4):null;}
const QUATRIN=['Q1 (gen–abr)','Q2 (mai–ago)','Q3 (set–des)'];
/* «Base de dades» de productes i proveïdors: valors únics ja introduïts, per triar-los de nou */
function distinctVals(arr,key){return [...new Set((arr||[]).map(x=>String(x[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ca'));}
function dlOpts(vals){return vals.map(v=>`<option value="${esc(v)}"></option>`).join('');}
/* Total pendent de pagar d'un conjunt de factures (per defecte, totes les de l'any actiu) */
function facturesPendentsTotal(fs){return (fs||Y().factures).reduce((s,f)=>s+Math.max(0,num(f.imp)-factPagat(f)),0);}
function provList(){
  const vals=[...distinctVals(Y().bacalla,'prov'),...distinctVals(Y().conserva,'prov'),...distinctVals(Y().altres,'prov'),...distinctVals(Y().factures,'empresa')];
  return [...new Set(vals)].sort((a,b)=>a.localeCompare(b,'ca'));
}
/* ===== Compres (bacallà i conserva): factura amb diversos productes ===== */
const COMPRA_CFG={
  bacalla:{qtyLab:'Kg',unitLab:'kg',concepte:'Bacallà'},
  conserva:{qtyLab:'Unitats',unitLab:'unitat',concepte:'Conserva'},
  // «Altres»: cada producte porta la seva unitat (kg, caixes, unitats…), no n'hi ha una de fixa
  altres:{qtyLab:'Quantitat',unitLab:'unitat',concepte:'Altres',unitatLliure:true}
};
/* Unitats suggerides per als productes d'«Altres»: les tres de sempre + les que ja has fet servir */
function unitatsCompra(){
  const dins=distinctVals((Y().altres||[]).flatMap(r=>r.productes||[]),'unitat');
  return [...new Set(['kg','caixes','unitats',...dins,...unitatsUsades()])];
}
/* Noms de les pestanyes de Compres: es poden reanomenar des de Configuració (desats a S.compresNoms) */
const COMPRES_TABS=[['bacalla','Bacallà'],['olives','Olives'],['conserva','Conserva'],['altres','Altres']];
function tabNomDefecte(k){const t=COMPRES_TABS.find(x=>x[0]===k);return t?t[1]:k;}
function tabNom(k){const n=(S.compresNoms||{})[k];return (n&&n.trim())?n.trim():tabNomDefecte(k);}
function titolCompra(type){return tabNom(type).toLowerCase();}
/* «de bacallà» però «d'altres»: apostrofa davant de vocal */
function deTitol(type){const t=titolCompra(type);return /^[aeiouàèéíòóúï]/i.test(t)?"d'"+t:'de '+t;}
/* Imports d'una compra:
   - base   = suma dels imports escrits a cada producte (SENSE IVA). És el que fan servir el
              €/kg, el resum per producte i els subtotals: així no es mou res de l'històric.
   - ambIva = base + l'IVA de cada producte (cada línia pot dur el seu %; buit = 0).
   - total  = l'import final de la factura. Si l'escrius tu, mana el teu; si no, és ambIva.
              És el que compta a la factura, al dietari i al banc.
   - descompte = ambIva − total (el que et rebaixa el proveïdor).                                */
const IVA_DEFECTE=11.4; // 10% d'IVA + 1,4% de recàrrec d'equivalència
function ivaDefecte(){return S.ivaDefecte!=null?num(S.ivaDefecte):IVA_DEFECTE;}
function compraBase(r){return (r.productes||[]).reduce((s,p)=>s+num(p.imp),0);}
function compraIva(r){return r2((r.productes||[]).reduce((s,p)=>s+num(p.imp)*num(p.iva)/100,0));}
function compraAmbIva(r){return r2(compraBase(r)+compraIva(r));}
function compraTotal(r){return r&&r.total!=null&&r.total!==''?num(r.total):compraAmbIva(r);}
function compraDescompte(r){return r2(compraAmbIva(r)-compraTotal(r));}
function compraQty(r){return (r.productes||[]).reduce((s,p)=>s+num(p.qty),0);}
/* Factura lligada a una compra i pagaments que hi consten */
function compraFactura(type,id){return Y().factures.find(x=>x.auto&&x.srcType===type&&x.srcId===id)||null;}
function compraPags(type,r){const f=r&&r.id?compraFactura(type,r.id):null;return f?factPags(f):[];}
/* Data efectiva d'una compra: SEMPRE la del pagament (la primera, si es paga en diversos terminis).
   Només si no hi ha cap pagament s'usa la data escrita a la compra. */
function compraData(type,r){
  const ds=compraPags(type,r).map(p=>p.data).filter(Boolean).sort();
  if(ds.length)return ds[0];
  return (r&&r.data)||'';
}
function compraLines(type){return (Y()[type]||[]).flatMap(r=>(r.productes||[]).map(p=>({producte:(p.producte||'').trim(),qty:num(p.qty),imp:num(p.imp),pv:p.pv,unitat:(p.unitat||'').trim(),prov:r.prov,data:compraData(type,r),invId:r.id})));}
function prodNames(type){return [...new Set(compraLines(type).map(p=>p.producte).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ca'));}
const PLNK='color:var(--blau);cursor:pointer;text-decoration:underline';
function vCompra(type){
  const cfg=COMPRA_CFG[type];
  const mix=!!cfg.unitatLliure;   // unitats diferents per producte: no es poden sumar entre elles
  const tabs=[['compres','Compres per dia'],['producte',mix?'Resum per article':'Resum per producte'],['quatri','Subtotals']];
  const sub=tabs.some(t=>t[0]===ctx.sub)?ctx.sub:'compres';
  const invs=(Y()[type]||[]).slice().sort((a,b)=>(compraData(type,a)||'')<(compraData(type,b)||'')?1:-1);
  let h=`<div class="subtabs">${tabs.map(([k,t])=>`<button data-sub="${k}" class="${k===sub?'on':''}">${t}</button>`).join('')}</div>`;
  if(sub==='compres'){
    // A «Altres» hi conviuen dues coses: les factures i el que has anotat al dia a dia amb
    // quantitat (Fp/FpL/Despeses). Van barrejades per data, però cada cosa queda marcada.
    const perDia={};
    if(mix)invLinies().forEach(l=>{(perDia[l.ds]=perDia[l.ds]||[]).push(l);});
    const items=[];
    invs.forEach(r=>items.push({t:'f',data:compraData(type,r)||'',r}));
    Object.keys(perDia).forEach(ds=>items.push({t:'d',data:ds,ls:perDia[ds]}));
    items.sort((a,b)=>(a.data||'')<(b.data||'')?1:-1);
    if(!items.length)h+=`<div class="card muted">Cap factura ${esc(deTitol(type))}. Afegeix-ne amb el botó +${mix?', o posa quantitat i unitat a una línia de Fp/FpL/Despeses des d\'«Entrada del dia»':''}.</div>`;
    else if(mix)h+='<p class="muted" style="margin:0 0 8px">Hi ha les factures i també el que has apuntat al dia a dia amb quantitat. Les entrades del dia a dia <b>no són factures</b>: no tenen proveïdor ni pagaments, i no compten als Subtotals.</p>';
    items.forEach(it=>{
      if(it.t==='d'){
        const tot=it.ls.reduce((s,l)=>s+l.imp,0);
        h+=`<div class="card tight">
          <div class="item clickable" data-diaitem="${it.data}" style="padding:2px 0 6px">
            <div><div class="t">Entrada del dia <span class="chip dietari">del dia a dia</span></div>
              <div class="s">${dataCA(it.data)} · ${it.ls.length} article(s) · no és una factura</div></div>
            <div class="imp num">${eur0(tot)}</div></div>
          <div class="scrollx"><table><thead><tr><th>Article</th><th>Bloc</th><th class="n">Quantitat</th><th class="n">Import</th></tr></thead><tbody>`;
        it.ls.forEach(l=>{h+=`<tr><td>${esc(l.c)}</td><td>${esc(l.bloc)}</td><td class="n">${l.quant.toLocaleString('ca-ES')} ${esc(l.unitat)}</td><td class="n">${eur0(l.imp)}</td></tr>`;});
        h+='</tbody></table></div></div>';
        return;
      }
      const r=it.r;
      h+=`<div class="card tight">
        <div class="item clickable" data-editinv="${type}|${r.id}" style="padding:2px 0 6px">
          <div><div class="t">${r.prov?`<span style="${PLNK}" data-provresum="${esc(r.prov)}">${esc(r.prov)}</span>`:'(sense proveïdor)'}${mix?' <span class="chip pagat">factura</span>':''}</div><div class="s">${(dd=>dd?dataCA(dd):'sense data')(compraData(type,r))}${(np=>np>1?' · '+np+' pagaments':'')(compraPags(type,r).length)} · ${(r.productes||[]).length} producte(s)</div></div>
          <div class="imp num">${eur0(compraTotal(r))}</div></div>
        <div class="scrollx"><table><thead><tr><th>Producte</th><th class="n">${cfg.qtyLab}</th><th class="n">Import</th><th class="n">IVA</th><th class="n">€/${cfg.unitLab}</th><th class="n">Venda</th><th class="n">% Ben.</th></tr></thead><tbody>`;
      (r.productes||[]).forEach(p=>{const qty=num(p.qty),imp=num(p.imp),cost=qty?imp/qty:0,ben=cost&&p.pv!=null?100*(num(p.pv)-cost)/cost:null;
        const qTxt=qty.toLocaleString('ca-ES')+(mix&&p.unitat?' '+esc(p.unitat):'');
        h+=`<tr><td><span style="${PLNK}" data-prodresum="${type}|${esc(p.producte||'')}">${esc(p.producte||'—')}</span></td><td class="n">${qTxt}</td><td class="n">${eur0(imp)}</td><td class="n">${num(p.iva)?num(p.iva).toLocaleString('ca-ES')+' %':'—'}</td><td class="n">${cost?cost.toFixed(2):'—'}</td><td class="n">${p.pv!=null?num(p.pv).toFixed(2):'—'}</td><td class="n ${ben!=null?(ben>=0?'pos':'neg'):''}">${ben!=null?ben.toFixed(1)+'%':'—'}</td></tr>`;});
      const rIva=compraIva(r), rDesc=compraDescompte(r);
      if(rIva||rDesc){
        h+=`<tr class="muted"><td colspan="2">Base sense IVA</td><td class="n">${eur0(compraBase(r))}</td><td colspan="4"></td></tr>`;
        if(rIva)h+=`<tr class="muted"><td colspan="2">+ IVA</td><td class="n">${eur0(rIva)}</td><td colspan="4"></td></tr>`;
        if(rDesc)h+=`<tr class="muted"><td colspan="2">− Descompte</td><td class="n">${eur0(-rDesc)}</td><td colspan="4"></td></tr>`;
        h+=`<tr class="total"><td colspan="2">Total factura</td><td class="n">${eur0(compraTotal(r))}</td><td colspan="4"></td></tr>`;
      }
      h+='</tbody></table></div></div>';
    });
  } else if(sub==='producte'&&mix){
    // Una sola llista d'articles: els de les factures i els del dia a dia, junts.
    // Cada parella (nom, unitat) és una fila: no es poden sumar kg amb caixes.
    const arts=articlesAltres();
    if(!arts.length)h+='<div class="card muted">Encara no hi ha articles. Crea una factura amb el botó +, o posa quantitat i unitat a una línia de Fp/FpL/Despeses des d\'«Entrada del dia».</div>';
    else{
      h+='<div class="card tight"><div class="scrollx"><table><thead><tr><th>Article</th><th class="n">Quantitat</th><th class="n">Import</th><th class="n">€/unitat</th><th>D\'on surt</th></tr></thead><tbody>';
      let gim=0;
      arts.forEach(a=>{gim+=a.imp;
        const font=(a.qFact&&a.qDia)?'les dues':(a.qFact?'factures':'dia a dia');
        h+=`<tr class="clickable" data-artalt="${esc(a.key)}"><td>${esc(a.nom)}</td><td class="n">${a.q.toLocaleString('ca-ES')} ${esc(a.unitat)}</td><td class="n">${eur0(a.imp)}</td><td class="n">${a.q?(a.imp/a.q).toFixed(2):'—'}</td><td class="muted">${font}</td></tr>`;});
      h+=`<tr class="total"><td>Total</td><td></td><td class="n">${eur0(gim)}</td><td colspan="2"></td></tr>`;
      h+='</tbody></table></div></div><div class="muted" style="font-size:.8rem">Junta el que compres per factura i el que apuntes al dia a dia amb quantitat. Cada article se separa per unitat (kg, caixes, unitats…): no es poden sumar entre elles. Els imports són sense IVA. Clica un article per veure'+"'"+'n el detall.</div>';
    }
  } else if(sub==='producte'){
    const names=prodNames(type);
    if(!names.length)h+='<div class="card muted">Encara no hi ha productes. Afegeix compres per veure el resum.</div>';
    else{
      h+=`<div class="card tight"><div class="scrollx"><table><thead><tr><th>Producte</th><th class="n">${cfg.qtyLab}</th><th class="n">Import</th><th class="n">€/${cfg.unitLab}</th></tr></thead><tbody>`;
      let gq=0,gim=0;
      names.forEach(nm=>{const ls=compraLines(type).filter(p=>p.producte===nm);const q=ls.reduce((s,p)=>s+p.qty,0),im=ls.reduce((s,p)=>s+p.imp,0);gq+=q;gim+=im;
        h+=`<tr class="clickable" data-prodresum="${type}|${esc(nm)}"><td>${esc(nm)}</td><td class="n">${q.toLocaleString('ca-ES')}</td><td class="n">${eur0(im)}</td><td class="n">${q?(im/q).toFixed(2):'—'}</td></tr>`;});
      h+=`<tr class="total"><td>Total (mitjana ponderada)</td><td class="n">${gq.toLocaleString('ca-ES')}</td><td class="n">${eur0(gim)}</td><td class="n">${gq?(gim/gq).toFixed(2):'—'}</td></tr>`;
      h+='</tbody></table></div></div><div class="muted" style="font-size:.8rem">Clica un producte per veure el detall complet. El €/'+cfg.unitLab+' total és la mitjana ponderada pels '+cfg.qtyLab.toLowerCase()+' (import total ÷ '+cfg.qtyLab.toLowerCase()+' totals).</div>';
    }
  } else {
    const pk=(im,q)=>q?(im/q).toFixed(2):'—';
    // amb unitats barrejades («Altres») no es mostren quantitats ni €/unitat: sumar kg amb caixes no vol dir res
