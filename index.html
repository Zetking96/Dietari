/* ===== Inventari: articles amb quantitat de les línies Fp/FpL/Despeses del dia ===== */
const INV_BLOCS=[['fpLines','Fp'],['fplLines','FpL'],['despLines','Despeses']];
/* Totes les línies amb quantitat, de tots els blocs, amb la data i el bloc d'origen */
function invLinies(){
  const out=[];
  Object.keys(Y().dies).forEach(ds=>{
    const d=Y().dies[ds];
    INV_BLOCS.forEach(([key,lab])=>{
      (d[key]||[]).forEach(l=>{
        if(l.quant==null||!(l.c||'').trim())return;
        out.push({ds,bloc:lab,c:l.c.trim(),unitat:(l.unitat||'').trim(),quant:num(l.quant),imp:num(l.imp)});
      });
    });
  });
  return out;
}
/* Articles d'«Altres» = (nom, unitat) normalitzats, ajuntant les DUES fonts: els productes de
   les factures i el que has apuntat al dia a dia amb quantitat. */
function artKey(nom,unitat){return (nom||'').trim().toLowerCase()+'|'+(unitat||'').trim().toLowerCase();}
function articlesAltres(){
  const map={};
  const posa=(nom,unitat,q,imp,origen)=>{
    if(!(nom||'').trim())return;
    const k=artKey(nom,unitat);
    if(!map[k])map[k]={key:k,nom:nom.trim(),unitat:(unitat||'').trim(),q:0,imp:0,qFact:0,impFact:0,qDia:0,impDia:0};
    map[k].q+=q; map[k].imp+=imp;
    if(origen==='f'){map[k].qFact+=q;map[k].impFact+=imp;}else{map[k].qDia+=q;map[k].impDia+=imp;}
  };
  compraLines('altres').forEach(p=>posa(p.producte,p.unitat,p.qty,p.imp,'f'));
  invLinies().forEach(l=>posa(l.c,l.unitat,l.quant,l.imp,'d'));
  return Object.values(map).sort((a,b)=>a.nom.localeCompare(b.nom,'ca')||a.unitat.localeCompare(b.unitat,'ca'));
}
/* Totes les entrades d'un article, de les dues fonts, ordenades per data */
function liniesArticleAltres(key){
  const out=[];
  compraLines('altres').forEach(p=>{if(artKey(p.producte,p.unitat)===key)
    out.push({data:p.data,origen:'Factura',detall:p.prov||'',q:p.qty,imp:p.imp});});
  invLinies().forEach(l=>{if(artKey(l.c,l.unitat)===key)
    out.push({data:l.ds,origen:'Dia a dia',detall:l.bloc,q:l.quant,imp:l.imp,ds:l.ds});});
  return out.sort((a,b)=>(a.data||'')<(b.data||'')?1:-1);
}

function isoD(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function parseISO(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function mondayISO(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);return isoD(x);}
function firstMondayY(y){const d=parseISO(mondayISO(new Date(y,0,1)));if(d.getFullYear()<y)d.setDate(d.getDate()+7);return isoD(d);}
function lastMondayY(y){return mondayISO(new Date(y,11,31));}

function defaultSet(){const y=parseInt(S.activeYear);const now=new Date();return now.getFullYear()===y?mondayISO(now):firstMondayY(y);}
function navSet(setISO,delta){const d=parseISO(setISO);d.setDate(d.getDate()+delta);let s=mondayISO(d);const y=parseInt(S.activeYear),lo=firstMondayY(y),hi=lastMondayY(y);if(s<lo)s=lo;if(s>hi)s=hi;return s;}

function olGraellaHTML(){

  const cell=(q,i)=>mode==='quant'?(q?q.toLocaleString('ca-ES'):''):mode==='imp'?(i?eur0(i):''):(q?eur(r2(i/q)):'');
  const label=mode==='quant'?'Quantitat':mode==='imp'?'Cost':'€/kg';
  let h=`<div style="margin:8px 0"><button class="small" id="olGridMode">Mostrant: ${label} (canvia)</button></div>`;

  h+='</tbody></table></div>';
  return h;
}

/* Coeficient = (Recaptació / (Despeses + Fp + FpL) − 1) en %. denom pot ser 0 (— llavors) */
function coefPct(rec,denom){return denom?100*(rec/denom-1):null;}
function coefCellHTML(rec,denom,bold){
  const p=coefPct(rec,denom);
  if(p==null)return '<td class="n">—</td>';
  const cls=p>=0?'pos':'neg', txt=p.toFixed(1)+' %';
  return `<td class="n ${cls}">${bold?'<b>'+txt+'</b>':txt}</td>`;
}
/* % de la recaptació anual que representa cada dia de la setmana (Dl–Ds), sobre el total brut
   (sense restar la comissió mensual, que no és d'un dia concret) */
function recPerDiaSetmana(){
  const q=[0,1,2].map(()=>[0,0,0,0,0,0]);
  for(let m=0;m<12;m++){
    const qi=Math.floor(m/4);
    isosDelMes(m).forEach(ds=>{
      const dow=(new Date(ds+'T12:00').getDay()+6)%7;
      q[qi][dow]+=recDia(dia(ds),ds);
    });
  }
  const sums=[0,1,2,3,4,5].map(i=>q[0][i]+q[1][i]+q[2][i]);
  const tot=sums.reduce((a,b)=>a+b,0);
  const qTot=q.map(s=>s.reduce((a,b)=>a+b,0));
  return {sums,tot,q,qTot};
}
function vResumAnual(){
  const tm=[],dcc=[],comm=[];
  for(let m=0;m<12;m++){tm.push(totalsMes(m));dcc.push(despCCMes(m));comm.push(comissioMes(m));}
  // Despeses inclou despeses c/c; Fp inclou FpL (sumats)
  const val=(m,k)=> k==='desp'?(tm[m].desp+dcc[m]) : k==='fp'?(tm[m].fp+tm[m].fpl) : tm[m][k];
  const files=[['Efectiu','ef'],['TPV','tpv'],['Recaptació','rec'],['Despeses (+ c/c)','desp'],['Fp + FpL','fp']];
  let h='<h2>Resum anual '+S.activeYear+'</h2><div class="card tight"><div class="scrollx"><table><thead><tr><th>Concepte</th>';
  for(let m=0;m<12;m++)h+='<th class="n">'+MESOS[m].slice(0,3)+'</th>';
  h+='<th class="n">Any</th></tr></thead><tbody>';
  files.forEach(([nom,k])=>{
    let t=0; h+='<tr><td>'+nom+'</td>';
    for(let m=0;m<12;m++){const v=val(m,k);t+=v;h+='<td class="n">'+(v?eur0(v):'')+'</td>';}
    h+='<td class="n"><b>'+eur0(t)+'</b></td></tr>';
  });
  let tcom=0; h+='<tr><td>Comissió TPV</td>';
  for(let m=0;m<12;m++){tcom+=comm[m];h+='<td class="n">'+(comm[m]?eur0(comm[m]):'')+'</td>';}
  h+='<td class="n"><b>'+eur0(tcom)+'</b></td></tr>';
  h+='</tbody></table></div></div>';
  // quatrimestres (4 mesos): Q1 gen–abr, Q2 mai–ago, Q3 set–des
  const KS=['ef','tpv','rec','desp','fp'], KN=['Efectiu','TPV','Recaptació','Despeses (+ c/c)','Fp + FpL'];
  const q=[0,1,2].map(i=>{const ms=[0,1,2,3].map(j=>i*4+j);const o={};KS.forEach(k=>o[k]=ms.reduce((s,m)=>s+val(m,k),0));return o;});
  const QN=['Q1 (gen–abr)','Q2 (mai–ago)','Q3 (set–des)'];
  h+='<div class="card"><h3>Quatrimestres</h3><div class="scrollx"><table><thead><tr><th></th>'+KN.map(n=>`<th class="n">${n}</th>`).join('')+'<th class="n">Coeficient</th></tr></thead><tbody>';
  q.forEach((t,i)=>{h+=`<tr><td>${QN[i]}</td>`+KS.map(k=>`<td class="n">${eur0(t[k])}</td>`).join('')+coefCellHTML(t.rec,t.desp+t.fp,false)+'</tr>';});
  const any={};KS.forEach(k=>any[k]=q.reduce((s,t)=>s+t[k],0));
  h+='<tr class="total"><td>Any</td>'+KS.map(k=>`<td class="n">${eur0(any[k])}</td>`).join('')+coefCellHTML(any.rec,any.desp+any.fp,true)+'</tr>';
  h+='</tbody></table></div>'+
    '<p class="muted" style="margin:8px 2px 0">Coeficient = (Recaptació ÷ (Despeses + Fp + FpL) − 1) × 100%</p></div>';
  h+=comparativaAnualHTML();
  // % de recaptació per dia de la setmana (cal el detall diari: als anys històrics no hi és)
  if(esHistoric())return h;
  const rds=recPerDiaSetmana(), sums=rds.sums, tot=rds.tot, qDia=rds.q, qDiaTot=rds.qTot;
  const cella=(v,t)=>`<td class="n">${v?eur0(v):''}<div class="muted" style="font-size:.75rem">${t&&v?(100*v/t).toFixed(1)+' %':''}</div></td>`;
  h+='<div class="card"><h3>Recaptació per dia de la setmana</h3><div class="scrollx"><table><thead><tr><th>Dia</th>'+
    QUATRIN.map(n=>`<th class="n">${n}</th>`).join('')+'<th class="n">Any</th></tr></thead><tbody>';
  DIES.forEach((nom,i)=>{
    h+=`<tr><td>${nom}</td>`+[0,1,2].map(qi=>cella(qDia[qi][i],qDiaTot[qi])).join('')+cella(sums[i],tot)+'</tr>';
  });
  h+='<tr class="total"><td>Total</td>'+[0,1,2].map(qi=>`<td class="n">${eur0(qDiaTot[qi])}</td>`).join('')+
    `<td class="n">${eur0(tot)}</td></tr></tbody></table></div>`+
    '<p class="muted" style="margin:8px 2px 0">El % de cada dia és sobre el total del seu període.</p></div>';
  return h;
}

/* ================= COMPARACIÓ ENTRE ANYS (resum anual) ================= */
const COMP_FILES=[['Recaptació','rec',false],['Despeses (+ c/c)','desp',true],['Fp + FpL','fp',true]];
function coefCompCell(c){return c==null?'<td class="n muted">—</td>':`<td class="n ${c>=0?'pos':'neg'}">${c.toFixed(1)} %</td>`;}
function taulaCompHTML(a,b,anyAct,anyAnt){
  let h=`<div class="scrollx"><table><thead><tr><th>Concepte</th><th class="n">${anyAct}</th><th class="n">${anyAnt}</th><th class="n">Variació</th></tr></thead><tbody>`;
  COMP_FILES.forEach(([nom,k,cost])=>{
    h+=`<tr><td>${nom}</td><td class="n">${eur0(a[k])}</td><td class="n">${eur0(b[k])}</td>`+varCellHTML(a[k],b[k],cost)+'</tr>';
  });
  const cA=coefPct(a.rec,a.desp+a.fp), cB=coefPct(b.rec,b.desp+b.fp);
  const dif=(cA!=null&&cB!=null)?cA-cB:null;
  h+='<tr class="total"><td>Coeficient</td>'+coefCompCell(cA)+coefCompCell(cB)+
    (dif!=null?`<td class="n ${dif>=0?'pos':'neg'}">${dif>=0?'+':'−'}${Math.abs(dif).toFixed(1)} punts</td>`:'<td class="n muted">—</td>')+'</tr>';
  return h+'</tbody></table></div>';
}
function capMes(i){const n=MESOS[i]||'';return n.charAt(0).toUpperCase()+n.slice(1);}
/* Anys que es poden fer servir de referència: tots els que existeixen menys el que estàs mirant */
function anysComparables(anyAct){
  const tots=new Set([...Object.keys(HISTORIC),...Object.keys(S.years||{})]);
  return [...tots].filter(a=>a!==anyAct&&anyExisteix(a)).sort().reverse();
}
/* Any contra el qual es compara TOT el bloc: el que has triat o, per defecte, l'anterior */
function anyComparacio(anyAct){
  const disp=anysComparables(anyAct);
  if(!disp.length)return null;
  if(ctx.compAny&&disp.indexOf(ctx.compAny)>=0)return ctx.compAny;
  const ant=String(parseInt(anyAct)-1);
  return disp.indexOf(ant)>=0?ant:disp[0];
}
/* Títol de la primera targeta segons el rang triat: de gener endavant és «el que portem d'any» */
function titolRangComp(mDes,mFins){
  if(mDes===0)return "El que portem d'any";
  return mDes===mFins?capMes(mDes):capMes(mDes)+'–'+capMes(mFins);
}
function comparativaAnualHTML(){
  const anyAct=S.activeYear, anyComp=anyComparacio(anyAct);
  const ultim=ultimMesAmbDades(anyAct), ultimComp=anyComp?ultimMesAmbDades(anyComp):-1;
  // rang de mesos: el tries tu; per defecte, de gener a l'últim mes amb moviment
  let mFins=(ctx.compFins!=null&&ctx.compFins>=0&&ctx.compFins<12)?ctx.compFins:ultim;
  let mDes=(ctx.compDes!=null&&ctx.compDes>=0&&ctx.compDes<12)?ctx.compDes:0;
  if(mDes>mFins)mDes=mFins;   // l'inici mai pot quedar després del final
  let h='';
  if(anyComp&&ultim>=0){
    // --- Selector d'any: val per a tot el bloc ---
    h+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">`+
      `<div><b>Comparar ${anyAct}</b> <span class="muted">contra…</span></div>`+
      `<select id="cmp_any" style="width:auto;min-width:110px">`+
      anysComparables(anyAct).map(y=>`<option value="${y}" ${y===anyComp?'selected':''}>${y}</option>`).join('')+
      `</select></div>`;
    // --- 1. Rang de mesos lliure: els mateixos mesos a banda i banda ---
    const a=acumulaRang(anyAct,mDes,mFins), b=acumulaRang(anyComp,mDes,mFins);
    const ara=new Date(), enCurs=(String(ara.getFullYear())===anyAct&&ara.getMonth()===mFins);
    const optMes=sel=>MESOS.map((nom,i)=>`<option value="${i}" ${i===sel?'selected':''}>${capMes(i)}${i>ultim?' (sense dades)':''}</option>`).join('');
    h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">`+
      `<h3 style="margin:0">${titolRangComp(mDes,mFins)}</h3>`+
      `<div style="display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0">`+
      `<select id="cmp_des" style="flex:1;min-width:0">${optMes(mDes)}</select>`+
      `<span class="muted">a</span>`+
      `<select id="cmp_fins" style="flex:1;min-width:0">${optMes(mFins)}</select></div></div>`+
      `<div class="muted" style="margin:8px 0">De ${MESOS[mDes]} a ${MESOS[mFins]}: ${anyAct} contra els mateixos mesos de ${anyComp}.</div>`+
      taulaCompHTML(a,b,anyAct,anyComp);
    if(enCurs)h+=`<p class="muted" style="margin:8px 2px 0">Compte: el ${MESOS[mFins]} de ${anyAct} encara no ha acabat, i a l'altra banda hi ha el mes sencer de ${anyComp}. Fins que no s'acabi, el % surt més baix del que li tocaria.</p>`;
    else if(mFins>ultim)h+=`<p class="muted" style="margin:8px 2px 0">De ${anyAct} només hi ha dades fins al ${MESOS[ultim]}: els mesos de després hi sumen zero i fan baixar el %.</p>`;
    if(ultimComp>=0&&mFins>ultimComp)h+=`<p class="muted" style="margin:8px 2px 0">De ${anyComp} només hi ha dades fins al ${MESOS[ultimComp]}: la banda de la comparació també queda coixa.</p>`;
    h+='</div>';
    // --- 2. Quatrimestres ---
    let files='';
    [0,1,2].forEach(qi=>{
      const qa=acumulaRang(anyAct,qi*4,qi*4+3), qb=acumulaRang(anyComp,qi*4,qi*4+3);
      if(!qa||!qb||(!qa.rec&&!qb.rec))return;
      files+=`<tr><td>${QUATRIN[qi]}</td><td class="n">${eur0(qa.rec)}</td><td class="n">${eur0(qb.rec)}</td>`+
        varCellHTML(qa.rec,qb.rec,false)+coefCompCell(coefPct(qa.rec,qa.desp+qa.fp))+coefCompCell(coefPct(qb.rec,qb.desp+qb.fp))+'</tr>';
    });
    if(files){
      h+=`<div class="card"><h3>Quatrimestres · ${anyAct} contra ${anyComp}</h3><div class="scrollx"><table><thead><tr><th>Període</th>`+
        `<th class="n">Recapt. ${anyAct}</th><th class="n">Recapt. ${anyComp}</th><th class="n">Variació</th>`+
        `<th class="n">Coef. ${anyAct}</th><th class="n">Coef. ${anyComp}</th></tr></thead><tbody>${files}`+
        '</tbody></table></div><p class="muted" style="margin:8px 2px 0">Els quatrimestres que encara no han començat no hi surten.</p></div>';
    }
    // --- 3. Any complet ---
    const a12=acumulaRang(anyAct,0,11), b12=acumulaRang(anyComp,0,11);
    h+=`<div class="card"><h3>Any complet · ${anyAct} contra ${anyComp}</h3>`+taulaCompHTML(a12,b12,anyAct,anyComp);
    if(ultim<11)h+=`<p class="muted" style="margin:8px 2px 0">De ${anyAct} només hi ha dades fins al ${MESOS[ultim]}: aquí es compara un any a mitges contra un de sencer. La comparació justa és la de dalt.</p>`;
    else if(ultimComp>=0&&ultimComp<11)h+=`<p class="muted" style="margin:8px 2px 0">De ${anyComp} només hi ha dades fins al ${MESOS[ultimComp]}: aquest any encara no és sencer.</p>`;
    h+='</div>';
  }
  // --- 4. Tendència de tots els anys ---
  const anys=Object.keys(S.years||{}).sort();
  const tComp=anyComp?acumulaRang(anyComp,0,11):null, recComp=tComp?tComp.rec:null;
  let tf='', prevRec=null, hiHaParcial=false;
  anys.forEach(a=>{
    const t=acumulaRang(a,0,11); if(!t||(!t.rec&&!t.desp&&!t.fp))return;
    const ult=ultimMesAmbDades(a), parcial=ult<11;
    if(parcial)hiHaParcial=true;
    const c=coefPct(t.rec,t.desp+t.fp);
    tf+=`<tr${a===anyAct?' class="total"':''}><td>${a}${parcial?` <span class="muted" style="font-weight:400">(fins ${MESOS[ult].slice(0,3)}.)</span>`:''}</td>`+
      `<td class="n">${eur0(t.rec)}</td>`+(prevRec?varCellHTML(t.rec,prevRec,false):'<td class="n muted">—</td>')+
      (anyComp?(a===anyComp?'<td class="n muted">—</td>':varCellHTML(t.rec,recComp,false)):'')+
      `<td class="n">${eur0(t.desp)}</td><td class="n">${eur0(t.fp)}</td>`+coefCompCell(c)+'</tr>';
    prevRec=t.rec;
  });
  if(tf){
    h+='<div class="card"><h3>Tendència de tots els anys</h3><div class="scrollx"><table><thead><tr><th>Any</th>'+
      '<th class="n">Recaptació</th><th class="n">vs any ant.</th>'+(anyComp?`<th class="n">vs ${anyComp}</th>`:'')+
      '<th class="n">Despeses (+ c/c)</th><th class="n">Fp + FpL</th><th class="n">Coeficient</th></tr></thead><tbody>'+tf+
      '</tbody></table></div><p class="muted" style="margin:8px 2px 0">Coeficient = (Recaptació ÷ (Despeses + Fp + FpL) − 1) × 100%.'+
      (anyComp?` La columna «vs ${anyComp}» compara cada any amb l'any de referència que has triat a dalt.`:'')+
      (hiHaParcial?' Els anys marcats «(fins …)» encara no han acabat, o sigui que la seva xifra no es pot comparar de tu a tu amb la dels anys sencers.':'')+'</p></div>';
  }
  return h;
}

  // Factures
  const ff=[['Número','Proveïdor','Import','Concepte','Categoria','Estat','Mode pagament','Pagat','Pagaments (data · taló · import)','Recaptació','Format','PDF','Observacions']];
  Y().factures.slice().sort((a,b)=>(a.num||0)-(b.num||0)).forEach(f=>{const pays=factPags(f);const pagStr=pays.map(p=>(p.data||'')+(p.talo?' · '+p.talo:'')+' · '+n0(p.imp)).join(' | ');ff.push([n0(f.num),f.empresa||'',n0(f.imp),f.concepte||'',f.categoria||'',factEstat(f),f.mode||'',n0(factPagat(f)),pagStr,f.recDia?'sí':'',f.format||'',f.pdf?'sí':'',f.obs||'']);});
  fullA(wb,ff,'Factures');
  // Bacallà (una fila per producte de cada factura)
  const bb=[['Data','Proveïdor','Producte','Kg','Import','IVA %','Import amb IVA','Cost €/kg','Preu venda €/kg','% Benefici','Total factura','Descompte factura']];
  Y().bacalla.forEach(r=>(r.productes||[]).forEach(p=>{const qty=num(p.qty),cost=qty?num(p.imp)/qty:'';
    bb.push([compraData('bacalla',r)||'',r.prov||'',p.producte||'',n0(p.qty),n0(p.imp),n0(p.iva),r2(num(p.imp)*(1+num(p.iva)/100)),cost===''?'':r2(cost),n0(p.pv),cost&&p.pv!=null?r2(100*(num(p.pv)-cost)/cost):'',r2(compraTotal(r)),r2(compraDescompte(r))]);}));
  fullA(wb,bb,'Bacallà');
  // Olives
  // Olives — matriu anual (tipus × mesos)
  const catO=Y().olivesCat.slice().sort((a,b)=>(a.ord==null?1e9:a.ord)-(b.ord==null?1e9:b.ord));
  const ohead=['Tipus','Nom']; MESOS.forEach(m=>{ohead.push(m+' Q');ohead.push(m+' €');}); ohead.push('Q1 €','Q2 €','Q3 €','Quant. any','Cost any','€/kg any');
  const oo=[ohead];
  const odata={}; catO.forEach(p=>odata[p.id]={q:Array(12).fill(0),i:Array(12).fill(0)});
  Y().olivesCompres.forEach(c=>{if(!c.set||!odata[c.prod])return;const m=parseInt(c.set.slice(5,7))-1;odata[c.prod].q[m]+=num(c.quant);odata[c.prod].i[m]+=num(c.imp);});
  catO.forEach(p=>{const d=odata[p.id];const row=[p.tipus,p.nom];const qt=[0,0,0];let aq=0,ai=0;
    for(let m=0;m<12;m++){row.push(d.q[m]||'');row.push(d.i[m]?r2(d.i[m]):'');qt[Math.floor(m/4)]+=d.i[m];aq+=d.q[m];ai+=d.i[m];}
    row.push(r2(qt[0]),r2(qt[1]),r2(qt[2]),r2(aq),r2(ai),aq?r2(ai/aq):'');oo.push(row);});
  fullA(wb,oo,'Olives');
  // Olives — detall setmanal
  const od=[['Setmana','Tipus','Nom','Quantitat','Cost','€/kg']];
  Y().olivesCompres.slice().filter(c=>c.set).sort((a,b)=>a.set<b.set?-1:1).forEach(c=>{const p=Y().olivesCat.find(x=>x.id===c.prod);
    od.push([c.set,p?p.tipus:'',p?p.nom:'?',n0(c.quant),n0(c.imp),num(c.quant)?r2(num(c.imp)/num(c.quant)):'']);});
  fullA(wb,od,'Olives setmanal');
  // Conserva (una fila per producte de cada factura)
  const kk=[['Data','Proveïdor','Producte','Unitats','Import','IVA %','Import amb IVA','Cost €/unitat','Preu venda','% Benefici','Total factura','Descompte factura']];
  Y().conserva.forEach(r=>(r.productes||[]).forEach(p=>{const qty=num(p.qty),cost=qty?num(p.imp)/qty:'';
    kk.push([compraData('conserva',r)||'',r.prov||'',p.producte||'',n0(p.qty),n0(p.imp),n0(p.iva),r2(num(p.imp)*(1+num(p.iva)/100)),cost===''?'':r2(cost),n0(p.pv),cost&&p.pv!=null?r2(100*(num(p.pv)-cost)/cost):'',r2(compraTotal(r)),r2(compraDescompte(r))]);}));
  fullA(wb,kk,'Conserva');
  // Altres (una fila per producte de cada factura; cada producte duu la seva unitat)
  const aa=[['Data','Proveïdor','Producte','Quantitat','Unitat','Import','IVA %','Import amb IVA','Cost €/unitat','Preu venda','% Benefici','Total factura','Descompte factura']];
  (Y().altres||[]).forEach(r=>(r.productes||[]).forEach(p=>{const qty=num(p.qty),cost=qty?num(p.imp)/qty:'';
    aa.push([compraData('altres',r)||'',r.prov||'',p.producte||'',n0(p.qty),p.unitat||'',n0(p.imp),n0(p.iva),r2(num(p.imp)*(1+num(p.iva)/100)),cost===''?'':r2(cost),n0(p.pv),cost&&p.pv!=null?r2(100*(num(p.pv)-cost)/cost):'',r2(compraTotal(r)),r2(compraDescompte(r))]);}));
  fullA(wb,aa,'Altres');
  XLSX.writeFile(wb,'Dietari_'+any+'.xlsx');
}
function r2(n){return Math.round((n||0)*100)/100;}
function n0(v){return v==null||v===''?'':r2(num(v));}
function fullA(wb,aoa,nom){const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=aoa[0].map((_,i)=>({wch:Math.min(30,Math.max(9,...aoa.map(r=>String(r[i]??'').length+1)))}));
  XLSX.utils.book_append_sheet(wb,ws,nom);}

/* ================= VISTA: CÒPIA DE SEGURETAT ================= */
function vCopia(){
  return `<h2>Còpia de seguretat</h2>
  <div class="card">
    <p class="muted">Les dades viuen només en aquest navegador. Fes còpies sovint i guarda-les fora del mòbil (correu, núvol…). Si el navegador esborra dades, sense còpia no es poden recuperar.</p>
    <button class="primary" id="expJson">Descarrega còpia (JSON)</button>
    <label style="margin-top:16px">Restaura des d'un fitxer</label>
    <input type="file" id="impJson" accept=".json,application/json">
    <div class="warn" style="margin-top:10px">Restaurar substitueix totes les dades actuals de tots els anys.</div>
  </div>`;
}
function bindCopia(){
  $('#expJson').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='dietari_copia_'+hui()+'.json';a.click();URL.revokeObjectURL(a.href);
  });
  $('#impJson').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{try{const d=JSON.parse(r.result);
      if(!d.years||!d.activeYear)throw 0;
      if(!confirm('Substituir totes les dades actuals per les del fitxer?'))return;
      S=d; saveCache(); pintaAnys(); go('avui');
      // puja immediatament al núvol i espera; així la còpia no es pot perdre en recarregar
      clearTimeout(saveTimer); savePending=true; syncStatus('pendent');
      await pushRemote();
      alert(savePending?'Restaurat al dispositiu, però NO s\'ha pogut desar al núvol (revisa la connexió i torna-ho a provar abans de tancar l\'app).':'Còpia restaurada i desada al núvol.');
    }catch(err){alert('El fitxer no és una còpia vàlida.');}};
    r.readAsText(f);
  });
}

/* ================= VISTA: CONFIGURACIÓ ================= */
function vConfig(){
  return `<h2>Configuració</h2>

    <button class="danger" id="cf_initOl" style="width:100%">Inicialitza olives (esborra compres + carrega tipus)</button>

    </div>
  </div>
  <div class="card">
    <h3>Compte</h3>
    <p class="muted">Sessió iniciada amb <b>${esc(sbUser&&sbUser.email||'—')}</b>. Canviar l'accés no toca cap dada: el compte segueix sent el mateix.</p>
    <label for="cf_passAra">Contrasenya actual</label>
    <input type="password" id="cf_passAra" autocomplete="current-password">
    <p class="muted" style="margin:0 0 10px">Cal per confirmar qualsevol dels dos canvis de sota.</p>
    <label for="cf_pass1">Contrasenya nova</label>
    <input type="password" id="cf_pass1" autocomplete="new-password">
    <label for="cf_pass2">Repeteix-la</label>
    <input type="password" id="cf_pass2" autocomplete="new-password">

    <label for="cf_email" style="margin-top:14px">Correu d'accés nou</label>

    <button id="cf_emailDesa">Canvia el correu</button>
    <p class="muted" style="margin-top:6px">En canviar el correu rebràs un missatge de confirmació a l'adreça nova. Fins que no hi cliquis, has de seguir entrant amb l'adreça d'ara.</p>

    <div id="cf_tabs">${COMPRES_TABS.map(([k,def])=>`

    <button class="danger" id="cf_reset" style="width:100%;margin-bottom:10px">Esborra totes les dades (comença de zero)</button>

function bindConfig(){
  /* Compte: canvi de contrasenya i de correu d'accés (mateix usuari, cap dada tocada).
     Tots dos canvis exigeixen tornar a validar la contrasenya actual, perquè una sessió
     oberta i desatesa no permeti que ningú et tanqui fora del teu propi compte. */
  const confirmaIdentitat=async()=>{
    const camp=$('#cf_passAra'), pw=camp.value;
    if(!pw){alert('Escriu la contrasenya actual per confirmar el canvi.');camp.focus();return false;}
    const email=sbUser&&sbUser.email;
    if(!email){alert('No hi ha cap sessió oberta.');return false;}
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){alert('La contrasenya actual no és correcta.');camp.focus();return false;}
    return true;
  };
  $('#cf_passDesa').addEventListener('click',async()=>{
    const p1=$('#cf_pass1').value, p2=$('#cf_pass2').value;
    if(p1.length<6){alert('La contrasenya ha de tenir 6 caràcters com a mínim.');return;}
    if(p1!==p2){alert('Les dues contrasenyes no coincideixen.');return;}
    if(!await confirmaIdentitat())return;
    const {error}=await sb.auth.updateUser({password:p1});
    if(error){alert('No s\'ha pogut canviar la contrasenya: '+error.message);return;}
    $('#cf_pass1').value=''; $('#cf_pass2').value=''; $('#cf_passAra').value='';
    alert('Contrasenya canviada. La pròxima vegada que entris, fes servir la nova.');
  });
  $('#cf_emailDesa').addEventListener('click',async()=>{
    const em=$('#cf_email').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){alert('Posa un correu vàlid.');return;}
    if(!confirm('Canviar el correu d\'accés a '+em+'?\n\nRebràs un missatge de confirmació a l\'adreça nova. Fins que no el confirmis, has de seguir entrant amb el correu d\'ara.'))return;
    if(!await confirmaIdentitat())return;
    const {error}=await sb.auth.updateUser({email:em});
    if(error){alert('No s\'ha pogut canviar el correu: '+error.message);return;}
    $('#cf_email').value=''; $('#cf_passAra').value='';
    alert('Fet. Obre el correu '+em+' i confirma el canvi des del missatge que hi trobaràs.');
  });
  $('#cf_ivaDesa').addEventListener('click',()=>{
    const v=numOrNull($('#cf_iva').value);
    if(v==null||v<0){alert('Posa un percentatge vàlid (0 o més).');return;}
    S.ivaDefecte=v; save(); alert('IVA per defecte desat: '+v+' %.');
  });
  $('#cf_tabsDesa').addEventListener('click',()=>{
    const noms={};
    document.querySelectorAll('#cf_tabs .lrow').forEach(row=>{
      const v=row.querySelector('.cf_tabnom').value.trim();
      if(v)noms[row.dataset.tabk]=v;
    });
    S.compresNoms=noms; save();
    alert('Noms desats.');
    render();
  });
  $('#cf_crea').addEventListener('click',()=>{
    const a=$('#cf_any').value.trim()||String(parseInt(S.activeYear)+1);
    if(!/^\d{4}$/.test(a)){alert('Posa un any de 4 xifres.');return;}
    if(S.years[a]){alert('Aquest any ja existeix.');return;}
    const nou=anyBuit();
    nou.olivesCat=JSON.parse(JSON.stringify(Y().olivesCat||[]));
    nou.factorConserva=Y().factorConserva;
    S.years[a]=nou;S.activeYear=a;save();pintaAnys();go('avui');
  });
  $('#cf_initOl').addEventListener('click',()=>{
    if(!confirm('Carregar els 19 tipus estàndard i ESBORRAR les compres d\'olives de '+S.activeYear+'?'))return;
    Y().olivesCat=SEED_OLIVES.map((o,i)=>({id:uid(),nom:o.nom,tipus:o.tipus,ord:i}));
    Y().olivesCompres=[];
    save();alert('Olives inicialitzades.');go('config');
  });
  document.querySelectorAll('#cf_cats .cf_catnom').forEach(inp=>inp.addEventListener('change',()=>{
    const id=inp.closest('[data-catid]').dataset.catid;const c=ccCat(id);
    if(c){c.nom=inp.value.trim()||c.nom;save();}
  }));
  document.querySelectorAll('#cf_cats .cf_catdel').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.del;const c=ccCat(id);
    if(c&&c.role){alert('Aquesta categoria està lligada a càlculs interns i no es pot esborrar.');return;}
    if(!confirm('Esborrar la categoria? Els moviments que la feien servir quedaran sense categoria.'))return;
    S.ccCats=ccCats().filter(x=>x.id!==id);save();go('config');
  }));
  $('#cf_cataddBtn').addEventListener('click',()=>{
    const nom=$('#cf_catnou').value.trim();if(!nom){alert('Posa un nom.');return;}
    ccCats().push({id:uid(),nom,role:null});save();go('config');
  });
  $('#cf_delTanc').addEventListener('click',()=>{
    if(!confirm('Esborrar TOTS els tancaments setmanals de '+S.activeYear+'? No es pot desfer.'))return;
    Y().tanc={};save();alert('Tancaments esborrats.');render();
  });
  $('#cf_reset').addEventListener('click',()=>{
    if(!confirm('Esborrar TOTES les dades introduïdes (dietari, tancaments, banc, factures i compres) de TOTS els anys i començar de zero? No es pot desfer.'))return;
    if(!confirm('Segur del tot? Aquesta acció esborra tots els apunts i no es pot desfer.'))return;
    Object.keys(S.years).forEach(a=>{S.years[a]=anyBuit();});
    S.ccCats=JSON.parse(JSON.stringify(CC_SEED));
    save();pintaAnys();alert('Fet: totes les dades esborrades. Comences de zero.');go('avui');
  });
  $('#cf_esborra').addEventListener('click',()=>{
    if(Object.keys(S.years).length===1){alert('No pots esborrar l\'únic any que hi ha.');return;}
    if(!confirm('Esborrar TOTES les dades de '+S.activeYear+'? No es pot desfer.'))return;
    if(!confirm('Segur? Última confirmació.'))return;
    delete S.years[S.activeYear];
    S.activeYear=Object.keys(S.years).sort().reverse()[0];
    save();pintaAnys();go('avui');
  });
}

function pintaAnys(){
  const sel=$('#anySel');if(!sel)return;
  sel.innerHTML=Object.keys(S.years).sort().map(a=>`<option ${a===S.activeYear?'selected':''}>${a}</option>`).join('');
}
$('#anySel').addEventListener('change',e=>{S.activeYear=e.target.value;save();go('avui');});
function bindVista(){
  ({avui:bindAvui,dietari:bindDietari,tancament:bindTancament,cc:bindCC,factures:bindFactures,
    mes:bindMes,compres:bindCompres,copia:bindCopia,config:bindConfig}[vista]||(()=>{}))();
}
arrenca();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
